name: Patch locale expected count line

on:
  push:
    branches:
      - release/0.3.0
    paths:
      - '.github/workflows/patch-locale-line.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.3.0
          fetch-depth: 0

      - name: Patch one exact line
        shell: pwsh
        run: |
          $path = './scripts/Build-Release.ps1'
          $content = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $old = @'
                  $content = Replace-RequiredLiteral -Content $content -OldValue $pair[0] -NewValue $pair[1] -PatchId ("testlab.locale-{0}" -f ($index + 1))
          '@.Trim()
          $new = @'
                  $expectedCount = if ($index -eq 3) { 2 } else { 1 }
                  $content = Replace-RequiredLiteral -Content $content -OldValue $pair[0] -NewValue $pair[1] -PatchId ("testlab.locale-{0}" -f ($index + 1)) -ExpectedCount $expectedCount
          '@.Trim()
          if ([regex]::Matches($content, [regex]::Escape($old)).Count -ne 1) {
            throw 'Locale patch line anchor mismatch.'
          }
          $content = $content.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/Build-Release.ps1
          git commit -m "fix: require both Strategy Lab locale anchors"
          git push origin HEAD:release/0.3.0
