name: Deploy NexRoute website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages v5.0.0

      - name: Install dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Typecheck website
        working-directory: website
        run: npm run typecheck

      - name: Build static export
        working-directory: website
        env:
          GITHUB_PAGES: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SITE_URL: https://onmaynec.github.io/NexRoute
          NEXT_PUBLIC_BASE_PATH: /NexRoute
        run: npm run build

      - name: Disable Jekyll processing
        if: github.event_name != 'pull_request'
        run: touch website/out/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact v5.0.0
        with:
          path: website/out

  deploy:
    name: Publish website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages v4.0.5
