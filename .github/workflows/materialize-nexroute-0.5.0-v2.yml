name: Materialize NexRoute 0.5.0 control suite v2

on:
  pull_request:
    paths:
      - '.github/workflows/materialize-nexroute-0.5.0-v2.yml'
      - '.github/scripts/materialize-nexroute-0.5.0.py'
      - '.github/scripts/materialize-nexroute-0.5.0-test-fixes.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  materialize:
    if: github.head_ref == 'agent/nexroute-0.5.0-control-suite'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Expand verified source payload
        shell: bash
        run: |
          cat .github/payloads/nr050.part* | base64 -d > /tmp/nr050.tar.xz
          echo '651eab7c33e067905202d6ce78b2d7c3d9f97bdf51fe4548fdb2212fb83fd4a8  /tmp/nr050.tar.xz' | sha256sum -c -
          tar -xJf /tmp/nr050.tar.xz -C .

      - name: Patch source and release metadata
        run: |
          python .github/scripts/materialize-nexroute-0.5.0.py
          python .github/scripts/materialize-nexroute-0.5.0-test-fixes.py

      - name: Validate source tree
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Run interface tests
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          $result = Invoke-Pester -Path ./tests/NextInterface.Tests.ps1 -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) NexRoute 0.5.0 tests failed." }

      - name: Commit materialized product source
        shell: bash
        run: |
          rm -f .github/scripts/materialize-nexroute-0.5.0.py
          rm -f .github/scripts/materialize-nexroute-0.5.0-test-fixes.py
          rm -f .github/payloads/nr050.tar.xz.b64 .github/payloads/nr050.part*
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'NexRoute 0.5.0: arrow control and automation suite'
          git push origin HEAD:${{ github.head_ref }}
