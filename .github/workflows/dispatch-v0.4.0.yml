name: Dispatch NexRoute 0.4.0 release once

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  dispatch:
    name: Remove dispatcher and start release
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Dispatch NexRoute 0.4.0 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Confirm pending release
        id: pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .service/version.txt)"
          if [[ "$version" != "0.4.0" ]]; then
            echo "Expected repository version 0.4.0, got $version" >&2
            exit 1
          fi
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-v0.4.0.yml
          git commit -m "ci: remove NexRoute 0.4.0 release dispatcher"
          git push origin HEAD:main

      - name: Dispatch verified release workflow
        if: steps.pending.outputs.release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main

      - name: Report and close trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment '${{ github.event.issue.number }}' --body 'Release workflow dispatched for NexRoute v0.4.0.'
          gh issue close '${{ github.event.issue.number }}' --reason completed
