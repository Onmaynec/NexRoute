name: Dispatch NexRoute 0.3.2 release once

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Remove dispatcher and start release
    if: github.repository == 'Onmaynec/NexRoute'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Confirm pending release
        id: pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .service/version.txt)"
          if [[ "$version" != "0.3.2" ]]; then
            echo "Expected repository version 0.3.2, got $version" >&2
            exit 1
          fi
          if gh release view v0.3.2 >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-v0.3.2.yml
          git commit -m "ci: remove NexRoute 0.3.2 release dispatcher"
          git push origin HEAD:main

      - name: Wait for clean main
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          for attempt in {1..12}; do
            actual="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$actual" == "$expected" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "main did not advance to dispatcher removal commit" >&2
          exit 1

      - name: Dispatch verified release workflow
        if: steps.pending.outputs.release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main
