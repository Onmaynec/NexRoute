name: Repair patch ID declaration

on:
  push:
    branches:
      - release/0.3.0
    paths:
      - '.github/workflows/patch-patchid-declaration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.3.0
          fetch-depth: 0

      - name: Repair declaration
        shell: pwsh
        run: |
          $path = './scripts/Build-Release.ps1'
          $content = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $old = " = New-Object 'System.Collections.Generic.HashSet[string]'"
          $new = @'
          $patchIds = New-Object 'System.Collections.Generic.HashSet[string]'
          '@.Trim()
          if ([regex]::Matches($content, [regex]::Escape($old)).Count -ne 1) {
            throw 'Damaged HashSet declaration anchor mismatch.'
          }
          $content = $content.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))

      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/Build-Release.ps1
          git commit -m "fix: restore patch ID HashSet declaration"
          git push origin HEAD:release/0.3.0
