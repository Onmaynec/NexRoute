name: Observe NexRoute 0.6.3 release

on:
  issues:
    types:
      - opened
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  observe:
    if: github.repository == 'Onmaynec/NexRoute' && (github.event_name != 'issues' || github.event.issue.title == 'Observe NexRoute 0.6.3 release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Read latest release run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json="$(gh run list --workflow release.yml --limit 1 --json databaseId,status,conclusion,headSha,event,url,createdAt,updatedAt)"
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$json" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          status="$(echo "$json" | jq -r '.[0].status // "missing"')"
          conclusion="$(echo "$json" | jq -r '.[0].conclusion // ""')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          body=$(printf 'Release observer:\n\n```json\n%s\n```' "$json")
          gh issue comment 56 --body "$body"

      - name: Remove observer after completion
        if: steps.run.outputs.status == 'completed'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/observe-v0.6.3-release.yml
          git commit -m "ci: remove NexRoute 0.6.3 release observer"
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "Release status captured in #56."
