name: Materialize NexRoute 0.4.1 Strategy Lab fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  materialize:
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Материализовать NexRoute 0.4.1 Strategy Lab fix'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/nexroute-0.4.1-strategy-lab-fix
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Patch sources and release metadata
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, got {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          # Base builder: preserve Cyrillic for Windows PowerShell 5.1.
          replace_once(
              'scripts/Build-NexRoute.ps1',
              "function Replace-RequiredPattern {",
              "function Write-Utf8Bom {\n    param(\n        [Parameter(Mandatory)][string]$Path,\n        [Parameter(Mandatory)][string]$Content\n    )\n    [System.IO.File]::WriteAllText($Path, $Content, [System.Text.UTF8Encoding]::new($true))\n}\n\nfunction Replace-RequiredPattern {",
          )
          replace_once(
              'scripts/Build-NexRoute.ps1',
              "        Write-Utf8NoBom -Path $testPath -Content ($testHeader + $testContent)",
              "        Write-Utf8Bom -Path $testPath -Content ($testHeader + $testContent)",
          )

          # Final release patcher must not remove the BOM again.
          replace_once(
              'scripts/Build-Release.ps1',
              "    [System.IO.File]::WriteAllText($Path, $content, (New-Object System.Text.UTF8Encoding($false)))\n    return $operations\n}\n\n$patchJournal",
              "    # Windows PowerShell 5.1 treats UTF-8 without BOM as the active ANSI code page.\n    # Keep an explicit BOM because Strategy Lab contains localized Cyrillic strings.\n    [System.IO.File]::WriteAllText($Path, $content, (New-Object System.Text.UTF8Encoding($true)))\n    return $operations\n}\n\n$patchJournal",
          )

          # Package contract: require the lab, require BOM, parse it, and probe Windows PowerShell 5.1.
          replace_once(
              'scripts/Test-Package.ps1',
              "    'service.bat','nexroute.bat','NexRoute.lnk','general.bat','bin/winws.exe',",
              "    'service.bat','nexroute.bat','NexRoute.lnk','general.bat','utils/test zapret.ps1','bin/winws.exe',",
          )
          anchor = """foreach ($token in @('-Mode Menu','-Mode Action','-Mode Status','-Mode StrategyPicker','-Mode PayloadManager','-Mode IpSetSwitch','-Mode SyncIpSet','-Mode SyncHosts','-Mode TestsIntro','-Mode Services')) {
    if ($service -notmatch [regex]::Escape($token)) { throw \"service.bat is missing $token\" }
}

$uiPath = Join-Path $extractPath '.service/nexroute-ui.ps1'
"""
          replacement = """foreach ($token in @('-Mode Menu','-Mode Action','-Mode Status','-Mode StrategyPicker','-Mode PayloadManager','-Mode IpSetSwitch','-Mode SyncIpSet','-Mode SyncHosts','-Mode TestsIntro','-Mode Services')) {
    if ($service -notmatch [regex]::Escape($token)) { throw \"service.bat is missing $token\" }
}

$testLabPath = Join-Path $extractPath 'utils/test zapret.ps1'
$testLabBytes = [System.IO.File]::ReadAllBytes($testLabPath)
if ($testLabBytes.Length -lt 3 -or $testLabBytes[0] -ne 0xEF -or $testLabBytes[1] -ne 0xBB -or $testLabBytes[2] -ne 0xBF) {
    throw 'Strategy Lab must be encoded as UTF-8 with BOM for Windows PowerShell 5.1.'
}
$testLabTokens = $null
$testLabParseErrors = $null
[void][System.Management.Automation.Language.Parser]::ParseFile($testLabPath, [ref]$testLabTokens, [ref]$testLabParseErrors)
if ($testLabParseErrors.Count -gt 0) {
    $details = ($testLabParseErrors | ForEach-Object { \"$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)\" }) -join '; '
    throw \"Strategy Lab has PowerShell syntax errors: $details\"
}
if (Get-Command powershell.exe -ErrorAction SilentlyContinue) {
    $escapedTestLabPath = $testLabPath.Replace("'", "''")
    $probe = \"`$tokens=`$null; `$errors=`$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$escapedTestLabPath',[ref]`$tokens,[ref]`$errors); if (`$errors.Count -gt 0) { `$errors | ForEach-Object { Write-Error `$_.Message }; exit 1 }\"
    & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $probe
    if ($LASTEXITCODE -ne 0) { throw 'Strategy Lab does not parse in Windows PowerShell 5.1.' }
}

$uiPath = Join-Path $extractPath '.service/nexroute-ui.ps1'
"""
          replace_once('scripts/Test-Package.ps1', anchor, replacement)

          # Version contract.
          Path('.service/version.txt').write_text('0.4.1\n', encoding='ascii')
          replace_once('website/package.json', '  "version": "0.4.0",', '  "version": "0.4.1",')
          write('.github/workflows/validate.yml', read('.github/workflows/validate.yml').replace('0.4.0', '0.4.1'))
          write('scripts/Test-Repository.ps1', read('scripts/Test-Repository.ps1').replace('0.4.0', '0.4.1'))

          # Repository validation guards for this regression.
          replace_once(
              'scripts/Test-Repository.ps1',
              "    'Building Flowseal','verified archive'\n)) {",
              "    'Building Flowseal','verified archive','System.Text.UTF8Encoding($true)'\n)) {",
          )
          package_guard_anchor = "$serviceMatrixTests = Get-Content -LiteralPath (Join-Path $root 'tests/ServiceMatrix.Tests.ps1') -Raw\n"
          package_guard = """$packageTest = Get-Content -LiteralPath (Join-Path $root 'scripts/Test-Package.ps1') -Raw
foreach ($token in @('utils/test zapret.ps1','UTF-8 with BOM','powershell.exe','Strategy Lab does not parse in Windows PowerShell 5.1')) {
    Assert-True ($packageTest -match [regex]::Escape($token)) \"Package test contains Strategy Lab regression guard: $token\"
}

$serviceMatrixTests = Get-Content -LiteralPath (Join-Path $root 'tests/ServiceMatrix.Tests.ps1') -Raw
"""
          replace_once('scripts/Test-Repository.ps1', package_guard_anchor, package_guard)

          # Changelog and release notes.
          changelog_entry = """## [0.4.1] - 2026-08-02

### Fixed

- пункт `[12] STRATEGY LAB` больше не падает с ошибками парсера в Windows PowerShell 5.1;
- `utils/test zapret.ps1` теперь упаковывается как UTF-8 с BOM, поэтому русские строки не превращаются в mojibake `Р…`;
- release pipeline проверяет BOM, синтаксис лаборатории и отдельный parse-probe через `powershell.exe`.

"""
          replace_once('CHANGELOG.md', 'Пока нет изменений.\n\n## [0.4.0]', 'Пока нет изменений.\n\n' + changelog_entry + '## [0.4.0]')

          readme_section = """## Что изменилось в 0.4.1 🧪

Версия `0.4.1` исправляет запуск пункта `[12] STRATEGY LAB` в стандартном Windows PowerShell 5.1.

- тестовая лаборатория сохраняется как UTF-8 с BOM;
- русские строки больше не повреждаются при чтении скрипта;
- CI проверяет BOM и синтаксис `utils/test zapret.ps1` через Windows PowerShell;
- обновление устанавливается обычным встроенным Update Center с backup и rollback.

"""
          replace_once('README.md', '[![Version](https://img.shields.io/badge/version-0.4.0-24e1d6)]', '[![Version](https://img.shields.io/badge/version-0.4.1-24e1d6)]')
          replace_once('README.md', '## Что изменилось в 0.4.0 🌐', readme_section + '## Что изменилось в 0.4.0 🌐')
          text = read('README.md')
          text = text.replace('NexRoute-0.4.0-win-x64.zip', 'NexRoute-0.4.1-win-x64.zip')
          text = text.replace('-Version 0.4.0', '-Version 0.4.1')
          write('README.md', text)

          en_section = """## Version 0.4.1 — Strategy Lab compatibility fix

Version 0.4.1 fixes menu option `[12] STRATEGY LAB` under the built-in Windows PowerShell 5.1:

- the packaged laboratory is encoded as UTF-8 with BOM;
- localized Cyrillic strings no longer become mojibake and parser errors;
- CI verifies the BOM and parses the script through `powershell.exe`.

"""
          replace_once('docs/README_EN.md', '[![Version](https://img.shields.io/badge/version-0.4.0-24e1d6)]', '[![Version](https://img.shields.io/badge/version-0.4.1-24e1d6)]')
          replace_once('docs/README_EN.md', '## Version 0.4.0 — official website source', en_section + '## Version 0.4.0 — official website source')
          text = read('docs/README_EN.md').replace('NexRoute-0.4.0-win-x64.zip', 'NexRoute-0.4.1-win-x64.zip')
          write('docs/README_EN.md', text)

          notes = """# NexRoute 0.4.1

Patch release for Strategy Lab compatibility on Windows PowerShell 5.1.

## Fixed

- menu option `[12] STRATEGY LAB` no longer opens a window full of parser errors;
- `utils/test zapret.ps1` is packaged as UTF-8 with BOM so Cyrillic strings are decoded correctly;
- both the base builder and final release patcher preserve the BOM;
- package verification checks the BOM, parses the script, and runs a Windows PowerShell 5.1 parser probe.

## Upgrade

Use `[6] CHECK UPDATES`, run `nexroute-update.cmd`, or download the new portable ZIP. The updater creates a backup before installation and rolls back automatically on failure.
"""
          Path('.github/release-notes/v0.4.1.md').write_text(notes, encoding='utf-8', newline='\n')

      - name: Validate repository source contract
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Typecheck website
        working-directory: website
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Commit and push patch branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "NexRoute 0.4.1: fix Strategy Lab encoding on PowerShell 5.1"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Report success
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "NexRoute 0.4.1 Strategy Lab fix materialized on \`${TARGET_BRANCH}\`. Source validation and website build passed."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Remove one-shot workflow from main
        if: always()
        shell: bash
        run: |
          sha=$(gh api repos/${GITHUB_REPOSITORY}/contents/.github/workflows/materialize-strategy-lab-fix.yml?ref=main --jq .sha)
          gh api --method DELETE repos/${GITHUB_REPOSITORY}/contents/.github/workflows/materialize-strategy-lab-fix.yml \
            -f message='Remove one-shot Strategy Lab fix materializer' \
            -f sha="$sha" \
            -f branch=main
