name: Publish NexRoute 0.2.2

on:
  push:
    branches:
      - main
    paths:
      - '.service/version.txt'
      - 'overlay/**'
      - 'assets/nexroute-icon-parts/**'
      - 'scripts/Build-NexRoute-0.2.2.ps1'
      - 'scripts/Test-Package-0.2.2.ps1'
      - '.github/release-notes/v0.2.2.md'
      - '.github/workflows/publish-v0.2.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build, verify and publish v0.2.2
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate sources
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Build package
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -ne '0.2.2') { throw "Expected 0.2.2, got $version" }
          ./scripts/Build-NexRoute-0.2.2.ps1 `
            -Version $version `
            -UpstreamVersion '1.10.0' `
            -OutputDirectory ./artifacts

      - name: Verify package
        shell: pwsh
        run: |
          $result = ./scripts/Test-Package-0.2.2.ps1 `
            -ArtifactsDirectory ./artifacts `
            -ExtractDirectory (Join-Path $env:RUNNER_TEMP 'nexroute-release-test')
          "NEXROUTE_SHA256=$($result.Sha256)" >> $env:GITHUB_ENV
          "NEXROUTE_STRATEGIES=$($result.StrategyCount)" >> $env:GITHUB_ENV
          "NEXROUTE_SERVICES=$($result.ServiceCount)" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-0.2.2-win-x64
          path: |
            artifacts/NexRoute-0.2.2-win-x64.zip
            artifacts/NexRoute-0.2.2-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.2.2'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }

          gh release create $tag `
            './artifacts/NexRoute-0.2.2-win-x64.zip' `
            './artifacts/NexRoute-0.2.2-win-x64.zip.sha256' `
            --target $env:GITHUB_SHA `
            --title 'NexRoute 0.2.2 — Full Service Matrix Update' `
            --notes-file './.github/release-notes/v0.2.2.md' `
            --latest

          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $tag" }
          Write-Host "Published $tag"
          Write-Host "Strategies: $env:NEXROUTE_STRATEGIES"
          Write-Host "Services: $env:NEXROUTE_SERVICES"
          Write-Host "SHA-256: $env:NEXROUTE_SHA256"
