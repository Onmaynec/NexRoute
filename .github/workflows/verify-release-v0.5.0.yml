name: Verify NexRoute v0.5.0 release

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == '[verify-release-v0.5.0]'
    runs-on: ubuntu-latest

    steps:
      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" --dir assets --pattern 'NexRoute-0.5.0-win-x64.zip*'
          test -f assets/NexRoute-0.5.0-win-x64.zip
          test -f assets/NexRoute-0.5.0-win-x64.zip.sha256

      - name: Verify checksum and attestations
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum --check NexRoute-0.5.0-win-x64.zip.sha256
          gh attestation verify NexRoute-0.5.0-win-x64.zip --repo "$GITHUB_REPOSITORY"
          gh attestation verify NexRoute-0.5.0-win-x64.zip.sha256 --repo "$GITHUB_REPOSITORY"
          archive_sha=$(sha256sum NexRoute-0.5.0-win-x64.zip | awk '{print $1}')
          checksum_sha=$(sha256sum NexRoute-0.5.0-win-x64.zip.sha256 | awk '{print $1}')
          archive_size=$(stat -c%s NexRoute-0.5.0-win-x64.zip)
          checksum_size=$(stat -c%s NexRoute-0.5.0-win-x64.zip.sha256)
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "checksum_sha=$checksum_sha" >> "$GITHUB_OUTPUT"
          echo "archive_size=$archive_size" >> "$GITHUB_OUTPUT"
          echo "checksum_size=$checksum_size" >> "$GITHUB_OUTPUT"

      - name: Publish verification report
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA: ${{ steps.verify.outputs.archive_sha }}
          CHECKSUM_SHA: ${{ steps.verify.outputs.checksum_sha }}
          ARCHIVE_SIZE: ${{ steps.verify.outputs.archive_size }}
          CHECKSUM_SIZE: ${{ steps.verify.outputs.checksum_size }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          body=$(cat <<EOF
          NexRoute v0.5.0 release verification completed.

          \`\`\`json
          {"tag":"v0.5.0","archive":"NexRoute-0.5.0-win-x64.zip","archiveSha256":"$ARCHIVE_SHA","archiveBytes":$ARCHIVE_SIZE,"checksumAssetSha256":"$CHECKSUM_SHA","checksumAssetBytes":$CHECKSUM_SIZE,"checksumMatched":true,"archiveAttestationVerified":true,"checksumAttestationVerified":true}
          \`\`\`
          EOF
          )
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
