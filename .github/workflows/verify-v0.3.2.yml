name: Verify NexRoute 0.3.2 release once

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  attestations: read
  issues: write

jobs:
  verify:
    name: Verify published assets and attestations
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Verify NexRoute 0.3.2 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Download and verify release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.3.2'
          archive='NexRoute-0.3.2-win-x64.zip'
          checksum="$archive.sha256"

          gh release view "$tag" \
            --json tagName,name,url,isDraft,isPrerelease,publishedAt,targetCommitish,assets \
            > release.json

          [[ "$(jq -r '.tagName' release.json)" == "$tag" ]]
          [[ "$(jq -r '.isDraft' release.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' release.json)" == 'false' ]]

          mapfile -t names < <(jq -r '.assets[].name' release.json | sort)
          [[ "${#names[@]}" -eq 2 ]]
          [[ "${names[0]}" == "$archive" ]]
          [[ "${names[1]}" == "$checksum" ]]

          mkdir release-assets
          gh release download "$tag" --dir release-assets \
            --pattern "$archive" --pattern "$checksum"

          expected="$(awk 'NF { print tolower($1); exit }' "release-assets/$checksum")"
          actual="$(sha256sum "release-assets/$archive" | awk '{ print tolower($1) }')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual" == "$expected" ]]

          gh attestation verify "release-assets/$archive" --repo "$GITHUB_REPOSITORY" \
            > archive-attestation.txt
          gh attestation verify "release-assets/$checksum" --repo "$GITHUB_REPOSITORY" \
            > checksum-attestation.txt

          {
            echo "Release: $tag"
            echo "Archive: $archive"
            echo "Checksum asset: $checksum"
            echo "SHA-256: $actual"
            echo "Archive attestation: verified"
            echo "Checksum attestation: verified"
          } > verification.txt

      - name: Report verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## NexRoute 0.3.2 release verification'
            echo
            echo '```text'
            cat verification.txt
            echo '```'
            echo
            echo '<details><summary>Release metadata</summary>'
            echo
            echo '```json'
            cat release.json
            echo '```'
            echo '</details>'
          } > verification-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file verification-comment.md

      - name: Remove one-shot verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-v0.3.2.yml
          git commit -m "ci: remove NexRoute 0.3.2 release verifier"
          git push origin HEAD:main

      - name: Close verification issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "Published release assets and attestations verified."
