name: Materialize NexRoute 0.4.0 website

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  materialize:
    name: Materialize verified website payload
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Materialize NexRoute 0.4.0 website'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/nexroute-0.4.0-website
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/nexroute-0.4.0.tar.gz
          cat .github/nexroute-v0.4.0-payload/part-* | tr -d '\r\n' | base64 -d > "$payload"
          echo 'bbd00c79e7d964008e6d973a17be0d6036bee283cf0259b97566a8672282b910  /tmp/nexroute-0.4.0.tar.gz' | sha256sum --check --strict
          tar -xzf "$payload" -C .
          rm -rf .github/nexroute-v0.4.0-payload

      - name: Commit clean NexRoute 0.4.0 source tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'NexRoute 0.4.0: add official product website'
          git push origin HEAD:agent/nexroute-0.4.0-website
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment '${{ github.event.issue.number }}' --body "NexRoute 0.4.0 website materialized successfully at commit `${{ steps.commit.outputs.sha }}`. Payload SHA-256 verified."
          gh issue close '${{ github.event.issue.number }}' --reason completed
