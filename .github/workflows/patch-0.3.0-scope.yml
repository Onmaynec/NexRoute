name: Patch 0.3.0 proxy scope

on:
  push:
    branches:
      - release/0.3.0
    paths:
      - '.github/workflows/patch-0.3.0-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: patch proxy scope and manifest duplicate validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.3.0
          fetch-depth: 0

      - name: Apply narrow source fixes
        shell: pwsh
        run: |
          $builderPath = './scripts/Build-Release.ps1'
          $builder = Get-Content -LiteralPath $builderPath -Raw -Encoding UTF8
          foreach ($name in @(
            'nexrouteProxyReleaseUrl',
            'nexrouteProxyAssetUrl',
            'nexrouteProxyArchive',
            'nexrouteProxyRelease'
          )) {
            $old = '$script:' + $name
            $new = '$global:' + $name
            $count = [regex]::Matches($builder, [regex]::Escape($old)).Count
            if ($count -lt 2) { throw "Expected at least two references for $old, got $count." }
            $builder = $builder.Replace($old, $new)
          }
          $finallyAnchor = "finally {`n    if (Test-Path -LiteralPath `$tempRoot)"
          $cleanup = @'
finally {
    Remove-Variable -Name nexrouteProxyReleaseUrl,nexrouteProxyAssetUrl,nexrouteProxyArchive,nexrouteProxyRelease -Scope Global -ErrorAction SilentlyContinue
    if (Test-Path -LiteralPath $tempRoot)
'@
          if (-not $builder.Contains($finallyAnchor)) { throw 'Build-Release finally anchor was not found.' }
          $builder = $builder.Replace($finallyAnchor, $cleanup.TrimEnd())
          [System.IO.File]::WriteAllText($builderPath, $builder, [System.Text.UTF8Encoding]::new($false))

          $modulePath = './scripts/NexRoute.Upstream.psm1'
          $module = Get-Content -LiteralPath $modulePath -Raw -Encoding UTF8
          $oldDuplicate = 'if (($requiredPaths | Sort-Object -Unique).Count -ne $requiredPaths.Count) {'
          $newDuplicate = 'if (@($requiredPaths | Sort-Object -Unique).Count -ne $requiredPaths.Count) {'
          if (-not $module.Contains($oldDuplicate)) { throw 'Duplicate path validation anchor was not found.' }
          $module = $module.Replace($oldDuplicate, $newDuplicate)
          [System.IO.File]::WriteAllText($modulePath, $module, [System.Text.UTF8Encoding]::new($false))

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/Build-Release.ps1 scripts/NexRoute.Upstream.psm1
          git commit -m "fix: keep verified proxy state in shared scope"
          git push origin HEAD:release/0.3.0
