name: Build and publish NexRoute

on:
  push:
    branches:
      - main
    paths:
      - '.service/version.txt'
      - '.service/upstream-manifest.json'
      - 'overlay/**'
      - 'native/**'
      - 'assets/nexroute-icon-parts/**'
      - 'scripts/Build-NexRoute.ps1'
      - 'scripts/Build-Release.ps1'
      - 'scripts/Build-Package.ps1'
      - 'scripts/Build-NativeTray.ps1'
      - 'scripts/New-ValidationReport.ps1'
      - 'scripts/Resolve-PinnedUpstream.ps1'
      - 'scripts/NexRoute.Upstream.psm1'
      - 'scripts/Test-Package.ps1'
      - 'scripts/Test-Release.ps1'
      - 'scripts/Test-V06Desktop.ps1'
      - 'tests/**'
      - '.github/release-notes/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    name: Build, verify and publish current version
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "archive=NexRoute-$version-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Validate sources and behavior
        shell: pwsh
        run: |
          ./scripts/Test-Repository.ps1
          $result = Invoke-Pester -Path ./tests -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed." }

      - name: Build finalized package from immutable pinned upstream
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'zapret-discord-youtube-1.10.0.zip'
          $resolved = ./scripts/Resolve-PinnedUpstream.ps1 -OutputPath $cache
          if ($resolved.sha256 -ne '6b7c5a66cfd055b8e361f8b5fb00f00b167260f21b1c03d589f6008417fb94a2') {
            throw "Pinned upstream resolver returned an unexpected SHA-256: $($resolved.sha256)"
          }
          $result = ./scripts/Build-Package.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputDirectory ./artifacts `
            -UpstreamArchive $cache
          $build = $result | Select-Object -Last 1
          if ($build.UpstreamResolution -ne 'offline') { throw 'Release builder did not consume the locally verified archive.' }
          if (-not $build.UpdaterIncluded) { throw 'The release package was not finalized with the updater.' }
          if (-not $build.NativeTrayIncluded) { throw 'The release package was not finalized with the native tray controller.' }
          if (-not $build.NativeDashboardIncluded) { throw 'The release package was not finalized with the native dashboard.' }
          if (-not $build.NativeValidationIncluded) { throw 'The release package was not finalized with the native validation viewer.' }
          if (-not $build.PortableAttestationVerifierIncluded) { throw 'The release package has no portable attestation verifier.' }
          if (-not $build.DotResolverIncluded) { throw 'The release package has no transactional DoT resolver.' }
          "NEXROUTE_UPSTREAM_CACHE=$cache" >> $env:GITHUB_ENV
          "NEXROUTE_UPSTREAM_SHA256=$($build.UpstreamSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_PATCH_TARGETS=$($build.PatchTargetCount)" >> $env:GITHUB_ENV
          "NEXROUTE_NATIVE_TRAY_SHA256=$($build.NativeTraySha256)" >> $env:GITHUB_ENV
          "NEXROUTE_NATIVE_TRAY_INCLUDED=$($build.NativeTrayIncluded)" >> $env:GITHUB_ENV
          "NEXROUTE_NATIVE_DASHBOARD_INCLUDED=$($build.NativeDashboardIncluded)" >> $env:GITHUB_ENV
          "NEXROUTE_NATIVE_DASHBOARD_SHA256=$($build.NativeDashboardSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_NATIVE_VALIDATION_INCLUDED=$($build.NativeValidationIncluded)" >> $env:GITHUB_ENV
          "NEXROUTE_NATIVE_VALIDATION_SHA256=$($build.NativeValidationSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_PORTABLE_VERIFIER_INCLUDED=$($build.PortableAttestationVerifierIncluded)" >> $env:GITHUB_ENV
          "NEXROUTE_DOT_RESOLVER_INCLUDED=$($build.DotResolverIncluded)" >> $env:GITHUB_ENV

      - name: Verify package
        shell: pwsh
        run: |
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts `
            -ExtractDirectory (Join-Path $env:RUNNER_TEMP 'nexroute-release-test')
          "NEXROUTE_SHA256=$($result.Sha256)" >> $env:GITHUB_ENV
          "NEXROUTE_STRATEGIES=$($result.StrategyCount)" >> $env:GITHUB_ENV
          "NEXROUTE_SERVICES=$($result.ServiceCount)" >> $env:GITHUB_ENV
          "NEXROUTE_NATIVE_TRAY_EXIT_CODE=$($result.NativeTrayExitCode)" >> $env:GITHUB_ENV
          $desktop = ./scripts/Test-V06Desktop.ps1 -ExtractDirectory $result.ExtractPath
          if ([int]$desktop.DashboardSelfTestExitCode -ne 0) { throw 'Native dashboard self-test did not pass in the release package.' }
          if ($desktop.DashboardSha256 -ne $env:NEXROUTE_NATIVE_DASHBOARD_SHA256) { throw 'Native dashboard digest differs from the build result.' }
          if ([int]$desktop.ValidationSelfTestExitCode -ne 0) { throw 'Native validation viewer self-test did not pass in the release package.' }
          if ($desktop.ValidationSha256 -ne $env:NEXROUTE_NATIVE_VALIDATION_SHA256) { throw 'Native validation viewer digest differs from the build result.' }
          if ([string]$desktop.ValidationTrustState -ne 'attestation-receipt-matched') { throw 'Native validation viewer did not distinguish the matching receipt state.' }
          "NEXROUTE_DASHBOARD_SELF_TEST_EXIT_CODE=$($desktop.DashboardSelfTestExitCode)" >> $env:GITHUB_ENV
          "NEXROUTE_DASHBOARD_FIXTURE_RUN_COUNT=$($desktop.FixtureRunCount)" >> $env:GITHUB_ENV
          "NEXROUTE_DASHBOARD_FIXTURE_RESULT_COUNT=$($desktop.FixtureResultCount)" >> $env:GITHUB_ENV
          "NEXROUTE_VALIDATION_VIEWER_SELF_TEST_EXIT_CODE=$($desktop.ValidationSelfTestExitCode)" >> $env:GITHUB_ENV
          "NEXROUTE_VALIDATION_VIEWER_CHECK_COUNT=$($desktop.ValidationCheckCount)" >> $env:GITHUB_ENV
          "NEXROUTE_VALIDATION_VIEWER_LIMITATION_COUNT=$($desktop.ValidationLimitationCount)" >> $env:GITHUB_ENV
          if ($result.UpstreamSha256 -ne $env:NEXROUTE_UPSTREAM_SHA256) { throw 'Built package contains a different upstream lock.' }
          if ([int]$result.PatchTargetCount -ne 23) { throw 'Built package patch report is incomplete.' }
          if ([int]$result.NativeTrayExitCode -ne 0) { throw 'Native tray self-test did not pass in the release package.' }

      - name: Generate hardware and OS validation report
        shell: pwsh
        run: |
          $result = ./scripts/New-ValidationReport.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputDirectory ./artifacts `
            -PackageSha256 $env:NEXROUTE_SHA256 `
            -UpstreamSha256 $env:NEXROUTE_UPSTREAM_SHA256 `
            -PatchTargetCount ([int]$env:NEXROUTE_PATCH_TARGETS) `
            -StrategyCount ([int]$env:NEXROUTE_STRATEGIES) `
            -ServiceCount ([int]$env:NEXROUTE_SERVICES) `
            -NativeTrayIncluded ([Convert]::ToBoolean($env:NEXROUTE_NATIVE_TRAY_INCLUDED)) `
            -NativeTrayExitCode ([int]$env:NEXROUTE_NATIVE_TRAY_EXIT_CODE) `
            -NativeDashboardIncluded ([Convert]::ToBoolean($env:NEXROUTE_NATIVE_DASHBOARD_INCLUDED)) `
            -NativeDashboardExitCode ([int]$env:NEXROUTE_DASHBOARD_SELF_TEST_EXIT_CODE) `
            -NativeDashboardSha256 $env:NEXROUTE_NATIVE_DASHBOARD_SHA256 `
            -NativeValidationIncluded ([Convert]::ToBoolean($env:NEXROUTE_NATIVE_VALIDATION_INCLUDED)) `
            -NativeValidationExitCode ([int]$env:NEXROUTE_VALIDATION_VIEWER_SELF_TEST_EXIT_CODE) `
            -NativeValidationSha256 $env:NEXROUTE_NATIVE_VALIDATION_SHA256 `
            -PortableAttestationVerifierIncluded ([Convert]::ToBoolean($env:NEXROUTE_PORTABLE_VERIFIER_INCLUDED)) `
            -DotResolverIncluded ([Convert]::ToBoolean($env:NEXROUTE_DOT_RESOLVER_INCLUDED)) `
            -Ipv6RuntimeStatus experimental
          $validation = $result | Select-Object -Last 1
          if ($validation.OverallStatus -eq 'failed') { throw 'The hardware and OS validation report contains failed required checks.' }
          "NEXROUTE_VALIDATION_STATUS=$($validation.OverallStatus)" >> $env:GITHUB_ENV
          "NEXROUTE_VALIDATION_JSON_SHA256=$($validation.JsonSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_VALIDATION_MARKDOWN_SHA256=$($validation.MarkdownSha256)" >> $env:GITHUB_ENV

      - name: Generate signed build provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/${{ steps.version.outputs.archive }}
            artifacts/${{ steps.version.outputs.archive }}.sha256
            artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.json
            artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.md

      - name: Verify signed build provenance
        shell: pwsh
        run: |
          foreach ($subject in @(
            "./artifacts/${{ steps.version.outputs.archive }}",
            "./artifacts/${{ steps.version.outputs.archive }}.sha256",
            "./artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.json",
            "./artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.md"
          )) {
            gh attestation verify $subject --repo "$env:GITHUB_REPOSITORY" --signer-repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw "Failed to verify build provenance for $subject" }
          }

      - name: Prove offline rebuild
        shell: pwsh
        run: |
          $result = ./scripts/Build-Package.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputDirectory ./artifacts-offline `
            -UpstreamArchive $env:NEXROUTE_UPSTREAM_CACHE
          $offlineBuild = $result | Select-Object -Last 1
          if ($offlineBuild.UpstreamResolution -ne 'offline') { throw 'Offline rebuild did not use offline resolution.' }
          if (-not $offlineBuild.UpdaterIncluded) { throw 'Offline rebuild was not finalized with the updater.' }
          if (-not $offlineBuild.NativeTrayIncluded) { throw 'Offline rebuild did not compile the native tray controller.' }
          if (-not $offlineBuild.NativeValidationIncluded) { throw 'Offline rebuild did not compile the native validation viewer.' }
          if ($offlineBuild.UpstreamSha256 -ne $env:NEXROUTE_UPSTREAM_SHA256) { throw 'Offline rebuild used a different upstream archive.' }
          $offline = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts-offline `
            -ExtractDirectory (Join-Path $env:RUNNER_TEMP 'nexroute-offline-release-test') `
            -SkipRuntime | Select-Object -Last 1
          if ($offline.UpstreamSha256 -ne $env:NEXROUTE_UPSTREAM_SHA256) { throw 'Offline package lock differs.' }
          if ([int]$offline.PatchTargetCount -ne 23) { throw 'Offline package patch report is incomplete.' }
          if ([int]$offline.NativeTrayExitCode -ne 0) { throw 'Native tray self-test failed in the offline package.' }
          $offlineDesktop = ./scripts/Test-V06Desktop.ps1 -ExtractDirectory $offline.ExtractPath
          if ([int]$offlineDesktop.ValidationSelfTestExitCode -ne 0) { throw 'Native validation viewer self-test failed in the offline package.' }
          if ([string]$offlineDesktop.ValidationTrustState -ne 'attestation-receipt-matched') { throw 'Offline validation viewer did not preserve trust-state behavior.' }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/${{ steps.version.outputs.archive }}
            artifacts/${{ steps.version.outputs.archive }}.sha256
            artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.json
            artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        id: publish
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            "created=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $notes = "./.github/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes are missing: $notes" }
          gh release create $tag `
            "./artifacts/${{ steps.version.outputs.archive }}" `
            "./artifacts/${{ steps.version.outputs.archive }}.sha256" `
            "./artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.json" `
            "./artifacts/NexRoute-${{ steps.version.outputs.version }}-validation.md" `
            --target $env:GITHUB_SHA `
            --title "NexRoute ${{ steps.version.outputs.version }}" `
            --notes-file $notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $tag" }
          "created=true" >> $env:GITHUB_OUTPUT

      - name: Close superseded tracking items
        if: steps.publish.outputs.created == 'true'
        shell: pwsh
        run: |
          $comment = 'Implemented and verified in NexRoute ${{ steps.version.outputs.tag }}.'
          foreach ($issue in 7,8,9,10) {
            $state = gh issue view $issue --json state --jq .state 2>$null
            if ($LASTEXITCODE -eq 0 -and $state -eq 'OPEN') {
              gh issue close $issue --comment $comment
            }
          }
          $prState = gh pr view 4 --json state --jq .state 2>$null
          if ($LASTEXITCODE -eq 0 -and $prState -eq 'OPEN') {
            gh pr close 4 --comment 'Superseded by the released NexRoute ${{ steps.version.outputs.tag }} implementation.'
          }

      - name: Print verified metadata
        shell: pwsh
        run: |
          Write-Host "Upstream SHA-256: $env:NEXROUTE_UPSTREAM_SHA256"
          Write-Host "Tracked patch targets: $env:NEXROUTE_PATCH_TARGETS"
          Write-Host "Strategies: $env:NEXROUTE_STRATEGIES"
          Write-Host "Services: $env:NEXROUTE_SERVICES"
          Write-Host "Native tray SHA-256: $env:NEXROUTE_NATIVE_TRAY_SHA256"
          Write-Host "Native dashboard SHA-256: $env:NEXROUTE_NATIVE_DASHBOARD_SHA256"
          Write-Host "Dashboard fixture runs/results: $env:NEXROUTE_DASHBOARD_FIXTURE_RUN_COUNT/$env:NEXROUTE_DASHBOARD_FIXTURE_RESULT_COUNT"
          Write-Host "Native validation viewer SHA-256: $env:NEXROUTE_NATIVE_VALIDATION_SHA256"
          Write-Host "Validation viewer checks/limitations: $env:NEXROUTE_VALIDATION_VIEWER_CHECK_COUNT/$env:NEXROUTE_VALIDATION_VIEWER_LIMITATION_COUNT"
          Write-Host "Package SHA-256: $env:NEXROUTE_SHA256"
          Write-Host "Validation status: $env:NEXROUTE_VALIDATION_STATUS"
          Write-Host "Validation JSON SHA-256: $env:NEXROUTE_VALIDATION_JSON_SHA256"
          Write-Host "Validation Markdown SHA-256: $env:NEXROUTE_VALIDATION_MARKDOWN_SHA256"
          Write-Host "Attestation: ${{ steps.attest.outputs.attestation-url }}"