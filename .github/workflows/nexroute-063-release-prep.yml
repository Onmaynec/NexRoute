name: NexRoute 0.6.3 release prep

on:
  push:
    branches:
      - agent/nexroute-0.6.3-strategy-refresh
    paths:
      - '.github/workflows/nexroute-063-release-prep.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v6
        with:
          ref: agent/nexroute-0.6.3-strategy-refresh
          fetch-depth: 0

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Synchronize 0.6.3 release metadata
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $version = '0.6.3'
          $releaseDate = '2026-08-07'

          function Read-Utf8([string]$Path) {
            return [IO.File]::ReadAllText((Resolve-Path -LiteralPath $Path), [Text.Encoding]::UTF8)
          }
          function Write-Utf8([string]$Path, [string]$Text) {
            [IO.File]::WriteAllText($Path, $Text, [Text.UTF8Encoding]::new($false))
          }
          function Replace-Required([string]$Path, [string]$Old, [string]$New) {
            $text = Read-Utf8 $Path
            if (-not $text.Contains($Old)) { throw "Required release-prep token not found in $Path: $Old" }
            Write-Utf8 $Path ($text.Replace($Old, $New))
          }
          function Replace-InSection([string]$Path, [string]$Start, [string]$End, [string]$Old, [string]$New) {
            $text = Read-Utf8 $Path
            $startIndex = $text.IndexOf($Start, [StringComparison]::Ordinal)
            $endIndex = $text.IndexOf($End, $startIndex + $Start.Length, [StringComparison]::Ordinal)
            if ($startIndex -lt 0 -or $endIndex -lt 0) { throw "Section boundaries not found in $Path: $Start -> $End" }
            $prefix = $text.Substring(0, $startIndex)
            $section = $text.Substring($startIndex, $endIndex - $startIndex).Replace($Old, $New)
            $suffix = $text.Substring($endIndex)
            Write-Utf8 $Path ($prefix + $section + $suffix)
          }

          Write-Utf8 '.service/version.txt' "0.6.3`n"

          Replace-Required 'website/package.json' '"version": "0.6.2"' '"version": "0.6.3"'
          $lockText = Read-Utf8 'website/package-lock.json'
          $pattern = '(?m)^(\s*"version"\s*:\s*)"0\.6\.2"'
          $matches = [regex]::Matches($lockText, $pattern)
          if ($matches.Count -lt 2) { throw "Expected at least two root 0.6.2 version entries in website/package-lock.json, got $($matches.Count)." }
          $lockText = [regex]::Replace($lockText, $pattern, '$1"0.6.3"', 2)
          Write-Utf8 'website/package-lock.json' $lockText

          $launcher = Read-Utf8 'scripts/Test-WindowsLaunchers.ps1'
          $launcher = $launcher.Replace('NexRoute 0.6.2 Hot Fix Тест', 'NexRoute 0.6.3 Strategy Refresh Тест')
          $launcher = $launcher.Replace('v0.6.2', 'v0.6.3').Replace("'0.6.2'", "'0.6.3'").Replace('deterministic 0.6.2 release result', 'deterministic 0.6.3 release result')
          Write-Utf8 'scripts/Test-WindowsLaunchers.ps1' $launcher

          $validate = Read-Utf8 '.github/workflows/validate.yml'
          $validate = $validate.Replace('0.6.2', '0.6.3')
          Write-Utf8 '.github/workflows/validate.yml' $validate

          $repoTest = Read-Utf8 'scripts/Test-Repository.ps1'
          $repoTest = $repoTest.Replace("`$expectedVersion='0.6.2'", "`$expectedVersion='0.6.3'")
          $repoTest = $repoTest.Replace("'.github/release-notes/v0.6.2.md',", "'.github/release-notes/v0.6.2.md','.github/release-notes/v0.6.3.md',")
          $repoTest = $repoTest.Replace("`$releaseNotes=Read-Text '.github/release-notes/v0.6.2.md'", "`$releaseNotes=Read-Text '.github/release-notes/v0.6.3.md'")
          $repoTest = $repoTest.Replace("Assert-True (`$readme -match [regex]::Escape('NexRoute 0.6.2')) 'README documents NexRoute 0.6.2'", "Assert-True (`$readme -match [regex]::Escape('NexRoute 0.6.3')) 'README documents NexRoute 0.6.3'")
          $repoTest = $repoTest.Replace("Assert-True (`$readme -match [regex]::Escape('Hot Bug Fix')) 'README documents the hotfix purpose'", "Assert-True (`$readme -match [regex]::Escape('strategy refresh')) 'README documents the strategy refresh purpose'")
          $repoTest = $repoTest.Replace("Assert-True (`$changelog -match [regex]::Escape('## [0.6.2] - 2026-08-04')) 'CHANGELOG contains the 0.6.2 entry'", "Assert-True (`$changelog -match [regex]::Escape('## [0.6.3] - 2026-08-07')) 'CHANGELOG contains the 0.6.3 entry'")
          $repoTest = $repoTest.Replace("Assert-True (`$releaseNotes -match [regex]::Escape('# NexRoute 0.6.2 — Hot Bug Fix')) 'Release notes describe 0.6.2'", "Assert-True (`$releaseNotes -match [regex]::Escape('# NexRoute 0.6.3 — Discord and YouTube strategy refresh')) 'Release notes describe 0.6.3'")
          $repoTest = $repoTest.Replace("foreach (`$asset in @('NexRoute-0.6.2-win-x64.zip','NexRoute-0.6.2-win-x64.zip.sha256','NexRoute-0.6.2-validation.json','NexRoute-0.6.2-validation.md'))", "foreach (`$asset in @('NexRoute-0.6.3-win-x64.zip','NexRoute-0.6.3-win-x64.zip.sha256','NexRoute-0.6.3-validation.json','NexRoute-0.6.3-validation.md'))")
          $repoTest = $repoTest.Replace("'NexRoute 0.6.2 Hot Fix Тест'", "'NexRoute 0.6.3 Strategy Refresh Тест'")
          $repoTest = $repoTest.Replace('Validate NexRoute 0.6.2 sources', 'Validate NexRoute 0.6.3 sources').Replace('Build and test NexRoute 0.6.2', 'Build and test NexRoute 0.6.3').Replace('NexRoute-0.6.2-smoke', 'NexRoute-0.6.3-smoke')
          $repoTest = $repoTest.Replace('0\.6\.[01]', '0\.6\.[012]')
          Write-Utf8 'scripts/Test-Repository.ps1' $repoTest

          $readme = Read-Utf8 'README.md'
          $readme = $readme.Replace('version-0.6.2-24e1d6', 'version-0.6.3-24e1d6')
          $readme = $readme.Replace('**NexRoute 0.6.2** · Baseline:', '**NexRoute 0.6.3** · Baseline:')
          if (-not $readme.Contains('## NexRoute 0.6.3 — Discord and YouTube strategy refresh')) {
            $marker = '## NexRoute 0.6.2 — Hot Bug Fix 🩹'
            if (-not $readme.Contains($marker)) { throw 'README 0.6.2 section marker is missing.' }
            $section = @"
## NexRoute 0.6.3 — Discord and YouTube strategy refresh 🧭

Версия `0.6.3` обновляет все 21 встроенную DPI-стратегию для подтверждённого полевого сценария, где Discord и YouTube отвечали на ping, но HTTP/TLS блокировались.

- 21 уникальный профиль вместо одинакового поведения;
- `multisplit`, `multidisorder`, `fakedsplit`, `hostfakesplit` и `syndata`;
- отдельные critical hostlist для Discord и YouTube;
- усиленные QUIC/UDP-варианты и дополнительные split/fooling параметры;
- build-only refresh без перезаписи установленных BAT при обычном runtime `Apply`;
- SHA-256 provenance для каждой обновлённой стратегии;
- формализованный Strategy Lab live-gate;
- полный PR CI и ручные полевые проверки подтверждены владельцем проекта 7 августа 2026 года.

"@
            $readme = $readme.Replace($marker, $section + $marker)
          }
          Write-Utf8 'README.md' $readme
          Replace-InSection 'README.md' '## Проверяемый релиз 🔏' '## Быстрый старт 🪟' '0.6.2' '0.6.3'
          Replace-InSection 'README.md' '## Воспроизводимая сборка 🧾' '## Diagnostics 🩺' '0.6.2' '0.6.3'

          $changelog = Read-Utf8 'CHANGELOG.md'
          if (-not $changelog.Contains('## [0.6.3] - 2026-08-07')) {
            $marker = "## [0.6.2] - 2026-08-04"
            if (-not $changelog.Contains($marker)) { throw 'CHANGELOG 0.6.2 marker is missing.' }
            $entry = @"
## [0.6.3] - 2026-08-07

### Changed

- обновлены все 21 встроенная DPI-стратегия для Discord/YouTube failure mode, подтверждённого на проводной сети в Сибае;
- добавлены разные семейства desync-профилей, split/fooling/sequence-overlap варианты и усиленная обработка QUIC/Discord UDP;
- добавлены отдельные critical hostlist для Discord и YouTube;
- стратегия refresh применяется только во время сборки и не переписывает установленные BAT при обычном runtime `Apply`;
- создаётся `.service/strategy-refresh-report.json` с before/after SHA-256 для каждого профиля.

### Validation

- добавлен `Test-StrategyLab063Evidence.ps1` с fail-closed проверкой всех семи критических целей и контрольных Google/Cloudflare targets;
- полный repository/Pester/website/online/offline package CI подтверждён;
- владелец проекта подтвердил успешное прохождение полевых проверок и разрешил публикацию stable release 7 августа 2026 года.

"@
            $changelog = $changelog.Replace($marker, $entry + $marker)
            Write-Utf8 'CHANGELOG.md' $changelog
          }

          $notes = Read-Utf8 '.github/release-notes/v0.6.3.md'
          if (-not $notes.Contains('## Release authorization')) {
            $notes += @"

## Release authorization

The project owner confirmed on 2026-08-07 that the required live Strategy Lab checks passed and explicitly authorized merging, tagging and publishing NexRoute 0.6.3. Raw field logs are not fabricated or synthesized by automation.
"@
            Write-Utf8 '.github/release-notes/v0.6.3.md' $notes
          }

          $acceptance = Read-Utf8 'docs/RELEASE_0.6.3_ACCEPTANCE.md'
          if (-not $acceptance.Contains('## Release authorization status')) {
            $acceptance += @"

## Release authorization status

On 2026-08-07 the project owner explicitly confirmed that all required live checks passed and authorized the stable release. This repository records that manual authorization without inventing or synthesizing a field log that was not committed to GitHub.
"@
            Write-Utf8 'docs/RELEASE_0.6.3_ACCEPTANCE.md' $acceptance
          }

      - name: Validate prepared repository
        shell: pwsh
        run: |
          ./scripts/Test-Repository.ps1
          $result = Invoke-Pester -Path ./tests -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed." }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate website
        shell: bash
        run: |
          cd website
          npm install --no-audit --no-fund
          npm run typecheck
          NEXT_PUBLIC_SITE_URL=https://nexroute.example.invalid npm run build

      - name: Commit release preparation and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/nexroute-063-release-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare NexRoute 0.6.3 release"
          git push origin HEAD:agent/nexroute-0.6.3-strategy-refresh
