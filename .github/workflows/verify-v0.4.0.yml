name: Verify NexRoute 0.4.0 release once

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  attestations: read
  issues: write

jobs:
  verify:
    name: Verify published release assets
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Verify NexRoute 0.4.0 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Remove one-shot verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-v0.4.0.yml
          git commit -m "ci: remove NexRoute 0.4.0 release verifier"
          git push origin HEAD:main

      - name: Download and verify release
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download v0.4.0 --dir release --pattern 'NexRoute-0.4.0-win-x64.zip' --pattern 'NexRoute-0.4.0-win-x64.zip.sha256'
          archive='release/NexRoute-0.4.0-win-x64.zip'
          checksum='release/NexRoute-0.4.0-win-x64.zip.sha256'
          test -s "$archive"
          test -s "$checksum"
          expected="$(awk 'NR==1 {print tolower($1)}' "$checksum")"
          actual="$(sha256sum "$archive" | awk '{print tolower($1)}')"
          [[ "$expected" == "$actual" ]]
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$checksum" --repo "$GITHUB_REPOSITORY"
          metadata="$(gh release view v0.4.0 --json tagName,name,isDraft,isPrerelease,publishedAt,targetCommitish,url,assets)"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          {
            echo 'metadata<<EOF'
            echo "$metadata"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/report.md <<'EOF'
          ## NexRoute 0.4.0 release verification

          ```text
          Release: v0.4.0
          Archive: NexRoute-0.4.0-win-x64.zip
          Checksum asset: NexRoute-0.4.0-win-x64.zip.sha256
          SHA-256: ${{ steps.verify.outputs.sha256 }}
          Archive attestation: verified
          Checksum attestation: verified
          ```

          <details><summary>Release metadata</summary>

          ```json
          ${{ steps.verify.outputs.metadata }}
          ```
          </details>
          EOF
          gh issue comment '${{ github.event.issue.number }}' --body-file /tmp/report.md
          gh issue close '${{ github.event.issue.number }}' --reason completed
