name: Diagnose NexRoute 0.3.2 release once

on:
  issues:
    types:
      - opened

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    name: Report latest release workflow run
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Diagnose NexRoute 0.3.2 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Collect release run status
        id: collect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --workflow release.yml --limit 5 \
            --json databaseId,status,conclusion,headSha,event,url,createdAt,updatedAt > release-runs.json
          run_id="$(jq -r '.[0].databaseId // empty' release-runs.json)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -n "$run_id" ]]; then
            gh run view "$run_id" --json jobs > release-jobs.json
            conclusion="$(jq -r '.[0].conclusion // empty' release-runs.json)"
            if [[ "$conclusion" == "failure" ]]; then
              gh run view "$run_id" --log-failed > release-failed.log 2>&1 || true
            fi
          fi

      - name: Comment diagnostic result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## NexRoute 0.3.2 release diagnostics'
            echo
            echo '```json'
            cat release-runs.json
            echo '```'
            if [[ -f release-jobs.json ]]; then
              echo
              echo '<details><summary>Jobs</summary>'
              echo
              echo '```json'
              cat release-jobs.json
              echo '```'
              echo '</details>'
            fi
            if [[ -s release-failed.log ]]; then
              echo
              echo '<details><summary>Failed log</summary>'
              echo
              echo '```text'
              tail -c 45000 release-failed.log
              echo
              echo '```'
              echo '</details>'
            fi
          } > diagnostic-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file diagnostic-comment.md

      - name: Remove one-shot diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-v0.3.2.yml
          git commit -m "ci: remove NexRoute 0.3.2 release diagnostics"
          git push origin HEAD:main

      - name: Close diagnostic issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "One-shot release diagnostics completed."
