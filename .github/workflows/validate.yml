name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate NexRoute 0.6.0 sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Validate source tree
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Run behavior, upstream, updater and attestation tests
        shell: pwsh
        run: |
          # Includes Updater fixture suites plus behavioral worker, media,
          # desktop, IPv6 and provenance acceptance suites.
          $result = Invoke-Pester -Path ./tests -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed." }

  website:
    name: Typecheck and build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Typecheck website
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        env:
          NEXT_PUBLIC_SITE_URL: https://nexroute.example.invalid
        run: npm run build

  build-smoke:
    name: Build and test NexRoute 0.6.0
    needs:
      - validate
      - website
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Build package from immutable pinned upstream
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -ne '0.6.0') { throw "Expected 0.6.0, got $version" }
          # UpstreamCachePath remains the supported write-through cache contract.
          # This job resolves the immutable asset first and passes it back as
          # UpstreamArchive, removing the GitHub Releases API dependency.
          $cache = Join-Path $env:RUNNER_TEMP 'zapret-discord-youtube-1.10.0.zip'
          $resolved = ./scripts/Resolve-PinnedUpstream.ps1 -OutputPath $cache
          if ($resolved.sha256 -ne '6b7c5a66cfd055b8e361f8b5fb00f00b167260f21b1c03d589f6008417fb94a2') {
            throw "Pinned upstream resolver returned an unexpected SHA-256: $($resolved.sha256)"
          }
          $result = ./scripts/Build-Package.ps1 `
            -Version $version `
            -OutputDirectory ./artifacts `
            -UpstreamArchive $cache *>&1 |
            Tee-Object -FilePath build-online.log
          $build = $result | Select-Object -Last 1
          if (-not $build.UpdaterIncluded) { throw 'The package was not finalized with the updater.' }
          if (-not $build.NativeTrayIncluded -or -not $build.NativeNotifierIncluded -or -not $build.NativeDashboardIncluded -or -not $build.NativeValidationIncluded) {
            throw 'The package was not finalized with all native Windows controllers.'
          }
          if ($build.UpstreamResolution -ne 'offline') { throw 'Builder did not consume the locally verified pinned archive.' }
          "NEXROUTE_UPSTREAM_CACHE=$cache" >> $env:GITHUB_ENV
          "NEXROUTE_UPSTREAM_SHA=$($build.UpstreamSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_PATCH_TARGETS=$($build.PatchTargetCount)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_DASHBOARD_SHA=$($build.NativeDashboardSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_VALIDATION_SHA=$($build.NativeValidationSha256)" >> $env:GITHUB_ENV

      - name: Verify online package
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'nexroute-online-test'
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts `
            -ExtractDirectory $extract *>&1 |
            Tee-Object -FilePath package-online.log
          $online = $result | Select-Object -Last 1
          $desktop = ./scripts/Test-V06Desktop.ps1 -ExtractDirectory $extract
          if ($desktop.DashboardSelfTestExitCode -ne 0) { throw 'Online dashboard self-test did not pass.' }
          if ($desktop.DashboardSha256 -ne $env:NEXROUTE_ONLINE_DASHBOARD_SHA) { throw 'Online dashboard hash differs from its build result.' }
          if ($desktop.ValidationSelfTestExitCode -ne 0) { throw 'Online validation viewer self-test did not pass.' }
          if ($desktop.ValidationSha256 -ne $env:NEXROUTE_ONLINE_VALIDATION_SHA) { throw 'Online validation viewer hash differs from its build result.' }
          if ($desktop.ValidationTrustState -ne 'attestation-receipt-matched') { throw 'Online validation viewer trust-state fixture failed.' }
          if ($desktop.NotificationToastChannel -ne 'windows-toast') { throw 'Online package did not prove the Windows toast channel.' }
          if ($desktop.NotificationFallbackChannel -ne 'native-balloon') { throw 'Online package did not prove the native notification fallback.' }
          "NEXROUTE_SHA256=$($online.Sha256)" >> $env:GITHUB_ENV
          "NEXROUTE_STRATEGIES=$($online.StrategyCount)" >> $env:GITHUB_ENV
          "NEXROUTE_SERVICES=$($online.ServiceCount)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_UPSTREAM_SHA=$($online.UpstreamSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_TOAST_CHANNEL=$($desktop.NotificationToastChannel)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_FALLBACK_CHANNEL=$($desktop.NotificationFallbackChannel)" >> $env:GITHUB_ENV

      - name: Rebuild completely offline from verified cache
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          $result = ./scripts/Build-Package.ps1 `
            -Version $version `
            -OutputDirectory ./artifacts-offline `
            -UpstreamArchive $env:NEXROUTE_UPSTREAM_CACHE *>&1 |
            Tee-Object -FilePath build-offline.log
          $offlineBuild = $result | Select-Object -Last 1
          if ($offlineBuild.UpstreamResolution -ne 'offline') { throw 'Offline build did not use offline resolution mode.' }
          if (-not $offlineBuild.UpdaterIncluded) { throw 'Offline build was not finalized with the updater.' }
          if (-not $offlineBuild.NativeDashboardIncluded) { throw 'Offline build did not compile the native dashboard.' }
          if (-not $offlineBuild.NativeValidationIncluded) { throw 'Offline build did not compile the native validation viewer.' }
          if ($offlineBuild.NativeDashboardSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Offline dashboard build did not return a valid SHA-256.' }
          if ($offlineBuild.NativeValidationSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Offline validation viewer build did not return a valid SHA-256.' }
          if ($offlineBuild.UpstreamSha256 -ne $env:NEXROUTE_ONLINE_UPSTREAM_SHA) { throw 'Online and offline upstream hashes differ.' }
          if ([int]$offlineBuild.PatchTargetCount -ne 23) { throw 'Offline build did not apply 23 tracked patch targets.' }
          "NEXROUTE_OFFLINE_DASHBOARD_SHA=$($offlineBuild.NativeDashboardSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_OFFLINE_VALIDATION_SHA=$($offlineBuild.NativeValidationSha256)" >> $env:GITHUB_ENV

      - name: Verify offline package
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'nexroute-offline-test'
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts-offline `
            -ExtractDirectory $extract `
            -SkipRuntime *>&1 |
            Tee-Object -FilePath package-offline.log
          $offline = $result | Select-Object -Last 1
          $desktop = ./scripts/Test-V06Desktop.ps1 -ExtractDirectory $extract
          if ($desktop.DashboardSelfTestExitCode -ne 0) { throw 'Offline dashboard self-test did not pass.' }
          if ($desktop.DashboardSha256 -ne $env:NEXROUTE_OFFLINE_DASHBOARD_SHA) { throw 'Offline dashboard hash differs from its build result.' }
          if ($desktop.ValidationSelfTestExitCode -ne 0) { throw 'Offline validation viewer self-test did not pass.' }
          if ($desktop.ValidationSha256 -ne $env:NEXROUTE_OFFLINE_VALIDATION_SHA) { throw 'Offline validation viewer hash differs from its build result.' }
          if ($desktop.ValidationTrustState -ne 'attestation-receipt-matched') { throw 'Offline validation viewer trust-state fixture failed.' }
          if ($desktop.NotificationToastChannel -ne 'windows-toast') { throw 'Offline package did not prove the Windows toast channel.' }
          if ($desktop.NotificationFallbackChannel -ne 'native-balloon') { throw 'Offline package did not prove the native notification fallback.' }
          if ($offline.UpstreamSha256 -ne $env:NEXROUTE_ONLINE_UPSTREAM_SHA) { throw 'Offline package lock differs from the online package lock.' }
          if ([int]$offline.PatchTargetCount -ne 23) { throw 'Offline package patch report is incomplete.' }
          if ([int]$offline.StrategyCount -ne [int]$env:NEXROUTE_STRATEGIES) { throw 'Online and offline strategy counts differ.' }
          if ([int]$offline.ServiceCount -ne [int]$env:NEXROUTE_SERVICES) { throw 'Online and offline service counts differ.' }
          "NEXROUTE_OFFLINE_TOAST_CHANNEL=$($desktop.NotificationToastChannel)" >> $env:GITHUB_ENV
          "NEXROUTE_OFFLINE_FALLBACK_CHANNEL=$($desktop.NotificationFallbackChannel)" >> $env:GITHUB_ENV

      - name: Upload logs and smoke package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NexRoute-0.6.0-smoke
          path: |
            build-online.log
            package-online.log
            build-offline.log
            package-offline.log
            artifacts/NexRoute-0.6.0-win-x64.zip
            artifacts/NexRoute-0.6.0-win-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Print verified metadata
        shell: pwsh
        run: |
          Write-Host "Upstream SHA-256: $env:NEXROUTE_ONLINE_UPSTREAM_SHA"
          Write-Host "Tracked patches: $env:NEXROUTE_PATCH_TARGETS"
          Write-Host "Strategies: $env:NEXROUTE_STRATEGIES"
          Write-Host "Services: $env:NEXROUTE_SERVICES"
          Write-Host "Online dashboard SHA-256: $env:NEXROUTE_ONLINE_DASHBOARD_SHA"
          Write-Host "Offline dashboard SHA-256: $env:NEXROUTE_OFFLINE_DASHBOARD_SHA"
          Write-Host "Online validation viewer SHA-256: $env:NEXROUTE_ONLINE_VALIDATION_SHA"
          Write-Host "Offline validation viewer SHA-256: $env:NEXROUTE_OFFLINE_VALIDATION_SHA"
          Write-Host "Online notification channels: $env:NEXROUTE_ONLINE_TOAST_CHANNEL -> $env:NEXROUTE_ONLINE_FALLBACK_CHANNEL"
          Write-Host "Offline notification channels: $env:NEXROUTE_OFFLINE_TOAST_CHANNEL -> $env:NEXROUTE_OFFLINE_FALLBACK_CHANNEL"
          Write-Host "Package SHA-256: $env:NEXROUTE_SHA256"
