name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate NexRoute 0.6.4 sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          show-progress: false

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Validate source tree
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Run behavior, upstream, updater, strategy and attestation tests
        shell: pwsh
        run: |
          $config = [PesterConfiguration]::Default
          $config.Run.Path = './tests'
          $config.Run.PassThru = $true
          $config.Run.Exit = $false
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'pester-results.xml'
          $result = Invoke-Pester -Configuration $config
          foreach ($test in @($result.Tests | Where-Object { $_.Result -eq 'Failed' })) {
            Write-Host ("FAILED TEST: {0}" -f $test.Name)
            if ($test.ErrorRecord) { Write-Host (($test.ErrorRecord | Out-String).Trim()) }
          }
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed." }

      - name: Upload Pester diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: NexRoute-Pester-results
          path: pester-results.xml
          if-no-files-found: warn
          retention-days: 7

  hardening:
    name: Hardening ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - StrategyLabFieldEvidence064.Tests.ps1
          - StrategyRanking064.Tests.ps1
          - UpdaterHealthRollback064.Tests.ps1
          - GitHubActionsPinning064.Tests.ps1

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          show-progress: false

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Run isolated hardening regression
        shell: pwsh
        run: |
          $path = Join-Path './tests' '${{ matrix.test }}'
          $result = Invoke-Pester -Path $path -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) isolated tests failed in $path." }

  website:
    name: Typecheck and build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Typecheck website
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        env:
          NEXT_PUBLIC_SITE_URL: https://nexroute.example.invalid
        run: npm run build

  build-smoke:
    name: Build and test NexRoute 0.6.4
    needs:
      - validate
      - hardening
      - website
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          show-progress: false

      - name: Build package from immutable pinned upstream
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -ne '0.6.3') { throw "Expected 0.6.3, got $version" }
          $cache = Join-Path $env:RUNNER_TEMP 'zapret-discord-youtube-1.10.3.zip'
          $resolved = ./scripts/Resolve-PinnedUpstream.ps1 -OutputPath $cache
          if ($resolved.sha256 -ne '244314ae1c24538a0d751601da8e0c925c843371eec4456eb15f14c4fd6b7058') {
            throw "Pinned upstream resolver returned an unexpected SHA-256: $($resolved.sha256)"
          }
          $result = ./scripts/Build-Package.ps1 `
            -Version $version `
            -OutputDirectory ./artifacts `
            -UpstreamArchive $cache *>&1 |
            Tee-Object -FilePath build-online.log
          $build = $result | Select-Object -Last 1
          if (-not $build.UpdaterIncluded -or -not $build.UpdaterEntryIncluded) { throw 'The package was not finalized with both updater layers.' }
          if (-not $build.NativeTrayIncluded -or -not $build.NativeNotifierIncluded -or -not $build.NativeDashboardIncluded -or -not $build.NativeValidationIncluded) {
            throw 'The package was not finalized with all native Windows controllers.'
          }
          if ($build.UpstreamResolution -ne 'offline') { throw 'Builder did not consume the locally verified pinned archive.' }
          "NEXROUTE_UPSTREAM_CACHE=$cache" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_UPSTREAM_SHA=$($build.UpstreamSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_PATCH_TARGETS=$($build.PatchTargetCount)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_DASHBOARD_SHA=$($build.NativeDashboardSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_VALIDATION_SHA=$($build.NativeValidationSha256)" >> $env:GITHUB_ENV

      - name: Verify online package and Windows launchers
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'nexroute-online-test'
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts `
            -ExtractDirectory $extract *>&1 |
            Tee-Object -FilePath package-online.log
          $online = $result | Select-Object -Last 1
          $desktop = ./scripts/Test-V06Desktop.ps1 -ExtractDirectory $extract
          if ([int]$desktop.DashboardSelfTestExitCode -ne 0) { throw 'Online dashboard self-test did not pass.' }
          if ($desktop.DashboardSha256 -ne $env:NEXROUTE_ONLINE_DASHBOARD_SHA) { throw 'Online dashboard hash differs from its build result.' }
          if ([int]$desktop.ValidationSelfTestExitCode -ne 0) { throw 'Online validation viewer self-test did not pass.' }
          if ($desktop.ValidationSha256 -ne $env:NEXROUTE_ONLINE_VALIDATION_SHA) { throw 'Online validation viewer hash differs from the build result.' }
          if ([string]$desktop.ValidationTrustState -ne 'attestation-receipt-matched') { throw 'Online validation viewer trust-state fixture failed.' }
          if ([string]$desktop.NotificationToastChannel -ne 'windows-toast') { throw 'Online package did not prove the Windows toast channel.' }
          if ([string]$desktop.NotificationFallbackChannel -ne 'native-balloon') { throw 'Online package did not prove the native notification fallback.' }
          $launchers = ./scripts/Test-WindowsLaunchers.ps1 -ExtractDirectory $extract
          if ($launchers.status -ne 'passed' -or [int]$launchers.launcherCount -ne 3) { throw 'Online Windows launcher smoke test did not pass.' }
          if ($launchers.diagnosticCompatibility -ne 'passed') { throw 'Online first-run diagnostic compatibility did not pass.' }
          if ($launchers.updaterFallbackVersion -ne '0.6.3') { throw 'Online API-free updater fallback did not resolve 0.6.3.' }
          "NEXROUTE_SHA256=$($online.Sha256)" >> $env:GITHUB_ENV
          "NEXROUTE_STRATEGIES=$($online.StrategyCount)" >> $env:GITHUB_ENV
          "NEXROUTE_SERVICES=$($online.ServiceCount)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_LAUNCHER_COUNT=$($launchers.launcherCount)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_DIAGNOSTIC=$($launchers.diagnosticCompatibility)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_UPDATER_FALLBACK=$($launchers.updaterFallbackVersion)" >> $env:GITHUB_ENV

      - name: Rebuild completely offline from verified cache
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          $result = ./scripts/Build-Package.ps1 `
            -Version $version `
            -OutputDirectory ./artifacts-offline `
            -UpstreamArchive $env:NEXROUTE_UPSTREAM_CACHE *>&1 |
            Tee-Object -FilePath build-offline.log
          $offlineBuild = $result | Select-Object -Last 1
          if ($offlineBuild.UpstreamResolution -ne 'offline') { throw 'Offline build did not use offline resolution mode.' }
          if (-not $offlineBuild.UpdaterIncluded -or -not $offlineBuild.UpdaterEntryIncluded) { throw 'Offline build was not finalized with both updater layers.' }
          if (-not $offlineBuild.NativeDashboardIncluded -or -not $offlineBuild.NativeValidationIncluded) { throw 'Offline build did not compile native desktop validation components.' }
          if ($offlineBuild.UpstreamSha256 -ne $env:NEXROUTE_ONLINE_UPSTREAM_SHA) { throw 'Online and offline upstream hashes differ.' }
          if ([int]$offlineBuild.PatchTargetCount -ne 24) { throw 'Offline build did not apply 24 tracked patch targets.' }
          "NEXROUTE_OFFLINE_DASHBOARD_SHA=$($offlineBuild.NativeDashboardSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_OFFLINE_VALIDATION_SHA=$($offlineBuild.NativeValidationSha256)" >> $env:GITHUB_ENV

      - name: Verify offline package and Windows launchers
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'nexroute-offline-test'
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts-offline `
            -ExtractDirectory $extract `
            -SkipRuntime *>&1 |
            Tee-Object -FilePath package-offline.log
          $offline = $result | Select-Object -Last 1
          $desktop = ./scripts/Test-V06Desktop.ps1 -ExtractDirectory $extract
          if ([int]$desktop.DashboardSelfTestExitCode -ne 0) { throw 'Offline dashboard self-test did not pass.' }
          if ($desktop.DashboardSha256 -ne $env:NEXROUTE_OFFLINE_DASHBOARD_SHA) { throw 'Offline dashboard hash differs from the build result.' }
          if ([int]$desktop.ValidationSelfTestExitCode -ne 0) { throw 'Offline validation viewer self-test did not pass.' }
          if ($desktop.ValidationSha256 -ne $env:NEXROUTE_OFFLINE_VALIDATION_SHA) { throw 'Offline validation viewer digest differs from the build result.' }
          if ([string]$desktop.ValidationTrustState -ne 'attestation-receipt-matched') { throw 'Offline validation viewer trust-state fixture failed.' }
          $launchers = ./scripts/Test-WindowsLaunchers.ps1 -ExtractDirectory $extract
          if ($launchers.status -ne 'passed' -or [int]$launchers.launcherCount -ne 3) { throw 'Offline Windows launcher smoke test did not pass.' }
          if ($launchers.diagnosticCompatibility -ne 'passed') { throw 'Offline first-run diagnostic compatibility did not pass.' }
          if ($launchers.updaterFallbackVersion -ne '0.6.3') { throw 'Offline API-free updater fallback did not resolve 0.6.3.' }
          if ($offline.UpstreamSha256 -ne $env:NEXROUTE_ONLINE_UPSTREAM_SHA) { throw 'Offline package lock differs from the online package lock.' }
          if ([int]$offline.PatchTargetCount -ne 23) { throw 'Offline package patch report is incomplete.' }
          if ([int]$offline.StrategyCount -ne [int]$env:NEXROUTE_STRATEGIES) { throw 'Online and offline strategy counts differ.' }
          if ([int]$offline.ServiceCount -ne [int]$env:NEXROUTE_SERVICES) { throw 'Online and offline service counts differ.' }
          "NEXROUTE_OFFLINE_LAUNCHER_COUNT=$($launchers.launcherCount)" >> $env:GITHUB_ENV
          "NEXROUTE_OFFLINE_DIAGNOSTIC=$($launchers.diagnosticCompatibility)" >> $env:GITHUB_ENV
          "NEXROUTE_OFFLINE_UPDATER_FALLBACK=$($launchers.updaterFallbackVersion)" >> $env:GITHUB_ENV

      - name: Prove real 0.6.2 to 0.6.3 updater migration and rollback
        shell: pwsh
        run: |
          $migration = ./scripts/Test-Updater063MigrationEvidence.ps1 -OutputPath ./updater-063-migration-evidence.json
          if ($migration.status -ne 'passed') { throw 'Real updater migration evidence gate did not pass.' }
          if (-not $migration.forcedHealthFailureRollback) { throw 'Forced health-check rollback was not proven.' }
          if (-not $migration.pathHasSpaces -or -not $migration.pathHasNonAscii -or $migration.absolutePathPublished) { throw 'Migration path/privacy evidence is incomplete.' }

      - name: Upload logs and smoke package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: NexRoute-0.6.3-smoke
          path: |
            build-online.log
            package-online.log
            build-offline.log
            package-offline.log
            updater-063-migration-evidence.json
            artifacts/NexRoute-0.6.3-win-x64.zip
            artifacts/NexRoute-0.6.3-win-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Print verified metadata
        shell: pwsh
        run: |
          Write-Host "Upstream SHA-256: $env:NEXROUTE_ONLINE_UPSTREAM_SHA"
          Write-Host "Tracked patches: $env:NEXROUTE_PATCH_TARGETS"
          Write-Host "Strategies: $env:NEXROUTE_STRATEGIES"
          Write-Host "Services: $env:NEXROUTE_SERVICES"
          Write-Host "Online launcher count: $env:NEXROUTE_ONLINE_LAUNCHER_COUNT"
          Write-Host "Offline launcher count: $env:NEXROUTE_OFFLINE_LAUNCHER_COUNT"
          Write-Host "Online first-run diagnostic contract: $env:NEXROUTE_ONLINE_DIAGNOSTIC"
          Write-Host "Offline first-run diagnostic contract: $env:NEXROUTE_OFFLINE_DIAGNOSTIC"
          Write-Host "Online updater fallback version: $env:NEXROUTE_ONLINE_UPDATER_FALLBACK"
          Write-Host "Offline updater fallback version: $env:NEXROUTE_OFFLINE_UPDATER_FALLBACK"
          Write-Host "Package SHA-256: $env:NEXROUTE_SHA256"
