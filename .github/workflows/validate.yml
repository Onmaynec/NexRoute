name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-contract:
    name: Apply updater package contract
    if: github.event_name == 'pull_request' && github.head_ref == 'release/0.3.1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.3.1
          fetch-depth: 0

      - name: Add updater files to release package
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/Build-Release.ps1')
          text = path.read_text(encoding='utf-8')
          marker = "    Write-Step 'Adding secure update center'"
          if marker in text:
              print('Updater package contract is already present.')
              raise SystemExit(0)

          old = "    Set-Content -LiteralPath (Join-Path $serviceDirectory 'language.txt') -Value 'EN' -Encoding ASCII\n\n    Write-Step 'Applying Service Matrix runtime'"
          new = """    Set-Content -LiteralPath (Join-Path $serviceDirectory 'language.txt') -Value 'EN' -Encoding ASCII

    Write-Step 'Adding secure update center'
    Copy-Item -LiteralPath (Join-Path $repositoryRoot 'overlay/.service/nexroute-updater.ps1') -Destination (Join-Path $serviceDirectory 'nexroute-updater.ps1') -Force
    Copy-Item -LiteralPath (Join-Path $repositoryRoot 'overlay/.service/i18n/nexroute-pages.ps1') -Destination (Join-Path $serviceDirectory 'i18n/nexroute-pages.ps1') -Force
    Copy-Item -LiteralPath (Join-Path $repositoryRoot 'overlay/.service/i18n/nexroute-pages-update.ps1') -Destination (Join-Path $serviceDirectory 'i18n/nexroute-pages-update.ps1') -Force
    Copy-Item -LiteralPath (Join-Path $repositoryRoot 'overlay/nexroute-update.cmd') -Destination (Join-Path $packageRoot 'nexroute-update.cmd') -Force

    Write-Step 'Applying Service Matrix runtime'"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one release package anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='')

      - name: Commit package contract
        shell: bash
        run: |
          if git diff --quiet -- scripts/Build-Release.ps1; then
            echo "No package contract changes required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/Build-Release.ps1
          git commit -m "fix: include secure updater in release package"
          git push origin HEAD:release/0.3.1

  validate:
    name: Validate NexRoute 0.3.1 sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Validate source tree
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Run behavior, upstream and updater tests
        shell: pwsh
        run: |
          # Includes ServiceMatrix, UpstreamContract and Updater fixture suites.
          $result = Invoke-Pester -Path ./tests -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed." }

  build-smoke:
    name: Build and test NexRoute 0.3.1
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Build online package and cache verified upstream
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -ne '0.3.1') { throw "Expected 0.3.1, got $version" }
          $cache = Join-Path $env:RUNNER_TEMP 'zapret-discord-youtube-1.10.0.zip'
          $result = ./scripts/Build-Release.ps1 `
            -Version $version `
            -OutputDirectory ./artifacts `
            -UpstreamCachePath $cache *>&1 |
            Tee-Object -FilePath build-online.log
          $build = $result | Select-Object -Last 1
          "NEXROUTE_UPSTREAM_CACHE=$cache" >> $env:GITHUB_ENV
          "NEXROUTE_UPSTREAM_SHA=$($build.UpstreamSha256)" >> $env:GITHUB_ENV
          "NEXROUTE_PATCH_TARGETS=$($build.PatchTargetCount)" >> $env:GITHUB_ENV

      - name: Verify online package
        shell: pwsh
        run: |
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts `
            -ExtractDirectory (Join-Path $env:RUNNER_TEMP 'nexroute-online-test') *>&1 |
            Tee-Object -FilePath package-online.log
          $online = $result | Select-Object -Last 1
          "NEXROUTE_SHA256=$($online.Sha256)" >> $env:GITHUB_ENV
          "NEXROUTE_STRATEGIES=$($online.StrategyCount)" >> $env:GITHUB_ENV
          "NEXROUTE_SERVICES=$($online.ServiceCount)" >> $env:GITHUB_ENV
          "NEXROUTE_ONLINE_UPSTREAM_SHA=$($online.UpstreamSha256)" >> $env:GITHUB_ENV

      - name: Rebuild completely offline from verified cache
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          $result = ./scripts/Build-Release.ps1 `
            -Version $version `
            -OutputDirectory ./artifacts-offline `
            -UpstreamArchive $env:NEXROUTE_UPSTREAM_CACHE *>&1 |
            Tee-Object -FilePath build-offline.log
          $offlineBuild = $result | Select-Object -Last 1
          if ($offlineBuild.UpstreamResolution -ne 'offline') { throw 'Offline build did not use offline resolution mode.' }
          if ($offlineBuild.UpstreamSha256 -ne $env:NEXROUTE_ONLINE_UPSTREAM_SHA) { throw 'Online and offline upstream hashes differ.' }
          if ([int]$offlineBuild.PatchTargetCount -ne 23) { throw 'Offline build did not apply 23 tracked patch targets.' }

      - name: Verify offline package
        shell: pwsh
        run: |
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts-offline `
            -ExtractDirectory (Join-Path $env:RUNNER_TEMP 'nexroute-offline-test') `
            -SkipRuntime *>&1 |
            Tee-Object -FilePath package-offline.log
          $offline = $result | Select-Object -Last 1
          if ($offline.UpstreamSha256 -ne $env:NEXROUTE_ONLINE_UPSTREAM_SHA) { throw 'Offline package lock differs from the online package lock.' }
          if ([int]$offline.PatchTargetCount -ne 23) { throw 'Offline package patch report is incomplete.' }
          if ([int]$offline.StrategyCount -ne [int]$env:NEXROUTE_STRATEGIES) { throw 'Online and offline strategy counts differ.' }
          if ([int]$offline.ServiceCount -ne [int]$env:NEXROUTE_SERVICES) { throw 'Online and offline service counts differ.' }

      - name: Upload logs and smoke package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-0.3.1-smoke
          path: |
            build-online.log
            package-online.log
            build-offline.log
            package-offline.log
            artifacts/NexRoute-0.3.1-win-x64.zip
            artifacts/NexRoute-0.3.1-win-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Print verified metadata
        shell: pwsh
        run: |
          Write-Host "Upstream SHA-256: $env:NEXROUTE_ONLINE_UPSTREAM_SHA"
          Write-Host "Tracked patches: $env:NEXROUTE_PATCH_TARGETS"
          Write-Host "Strategies: $env:NEXROUTE_STRATEGIES"
          Write-Host "Services: $env:NEXROUTE_SERVICES"
          Write-Host "Package SHA-256: $env:NEXROUTE_SHA256"
