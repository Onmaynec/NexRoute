name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate NexRoute 0.2.3 sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install pinned Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Validate source tree
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Run Service Matrix behavior tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests/ServiceMatrix.Tests.ps1 -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed." }

  build-smoke:
    name: Build and test NexRoute 0.2.3
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Build package
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -ne '0.2.3') { throw "Expected 0.2.3, got $version" }
          ./scripts/Build-Release.ps1 `
            -Version $version `
            -UpstreamVersion '1.10.0' `
            -OutputDirectory ./artifacts *>&1 |
            Tee-Object -FilePath build.log

      - name: Verify package
        shell: pwsh
        run: |
          $result = ./scripts/Test-Release.ps1 `
            -ArtifactsDirectory ./artifacts `
            -ExtractDirectory (Join-Path $env:RUNNER_TEMP 'nexroute-release-test') *>&1 |
            Tee-Object -FilePath package-test.log
          $result = $result | Select-Object -Last 1
          "NEXROUTE_SHA256=$($result.Sha256)" >> $env:GITHUB_ENV
          "NEXROUTE_STRATEGIES=$($result.StrategyCount)" >> $env:GITHUB_ENV
          "NEXROUTE_SERVICES=$($result.ServiceCount)" >> $env:GITHUB_ENV

      - name: Upload logs and smoke package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-0.2.3-smoke
          path: |
            build.log
            package-test.log
            artifacts/NexRoute-0.2.3-win-x64.zip
            artifacts/NexRoute-0.2.3-win-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Print verified metadata
        shell: pwsh
        run: |
          Write-Host "Strategies: $env:NEXROUTE_STRATEGIES"
          Write-Host "Services: $env:NEXROUTE_SERVICES"
          Write-Host "SHA-256: $env:NEXROUTE_SHA256"
