name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Validate NexRoute repository
        id: repository_validation
        continue-on-error: true
        shell: pwsh
        run: ./scripts/Test-Repository.ps1 *>&1 | Tee-Object -FilePath validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-validation-log
          path: validation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when repository validation failed
        if: steps.repository_validation.outcome == 'failure'
        shell: pwsh
        run: throw 'Repository validation failed. See NexRoute-validation-log.'

      - name: Verify release builder help
        shell: pwsh
        run: Get-Help ./scripts/Build-NexRoute.ps1 -Full | Out-Null

  build-smoke:
    name: Build and inspect NexRoute 0.2.0
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Build NexRoute smoke artifact
        id: package_build
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          try {
            ./scripts/Build-NexRoute.ps1 `
              -Version $version `
              -UpstreamVersion '1.10.0' `
              -OutputDirectory ./artifacts *>&1 | Tee-Object -FilePath build.log
          }
          catch {
            @(
              '',
              '=== TERMINATING EXCEPTION ===',
              ($_ | Out-String),
              '=== EXCEPTION DETAILS ===',
              ($_ | Format-List * -Force | Out-String),
              '=== SCRIPT STACK TRACE ===',
              $_.ScriptStackTrace
            ) -join [Environment]::NewLine | Tee-Object -FilePath build.log -Append
            throw
          }

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-windows-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when package build failed
        if: steps.package_build.outcome == 'failure'
        shell: pwsh
        run: throw 'Windows package build failed. See NexRoute-windows-build-log.'

      - name: Verify package and execute terminal pages
        id: package_verification
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            ./scripts/Test-Package.ps1 `
              -ArtifactsDirectory ./artifacts `
              -ExtractDirectory (Join-Path $env:RUNNER_TEMP 'nexroute-smoke') *>&1 |
              Tee-Object -FilePath package-test.log
          }
          catch {
            @(
              '',
              '=== TERMINATING EXCEPTION ===',
              ($_ | Out-String),
              '=== EXCEPTION DETAILS ===',
              ($_ | Format-List * -Force | Out-String),
              '=== SCRIPT STACK TRACE ===',
              $_.ScriptStackTrace
            ) -join [Environment]::NewLine | Tee-Object -FilePath package-test.log -Append
            throw
          }

      - name: Upload package verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-package-test-log
          path: package-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when package verification failed
        if: steps.package_verification.outcome == 'failure'
        shell: pwsh
        run: throw 'Package verification failed. See NexRoute-package-test-log.'

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-0.2.0-smoke-package
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7
