name: Подготовить NexRoute 0.4.1 один раз

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  materialize:
    name: Применить hotfix и запустить релиз
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Подготовить NexRoute 0.4.1 hotfix'
    runs-on: ubuntu-latest

    steps:
      - name: Получить main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Проверить исходную версию
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .service/version.txt)"
          if [[ "$version" != "0.4.0" ]]; then
            echo "Ожидалась версия 0.4.0, получена $version" >&2
            exit 1
          fi

      - name: Применить исправления 0.4.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: ожидалось одно совпадение, найдено {count}')
              return text.replace(old, new, 1)

          theme_path = 'overlay/.service/i18n/nexroute-theme.ps1'
          theme = read(theme_path)
          art_block = r'''function Write-NexRouteCentered {
              param([AllowNull()][string]$Value, [ConsoleColor]$Color = [ConsoleColor]::White)
              if ($null -eq $Value) { $Value = '' }
              $visible = $Value.TrimEnd()
              $padding = [Math]::Max(0, [int](($script:Width - $visible.Length) / 2))
              Write-Host ((' ' * $padding) + $visible) -ForegroundColor $Color
          }

          function Write-NexRouteLogo {
              # NEXROUTE_SKULL_CENTERED_V1
              $skull = @(
                  '        _______        ',
                  '      /         \      ',
                  '     /  _     _  \     ',
                  '    |  (_)   (_)  |    ',
                  '    |      ^      |    ',
                  '    |    \___/    |    ',
                  '     \  _______  /     ',
                  '      \/  | |  \/      '
              )
              $logo = @(
                  ' _   _  _____ __  __ ____   ___  _   _ _____ _____ ',
                  '| \ | || ____|\ \/ /|  _ \ / _ \| | | |_   _| ____|',
                  '|  \| ||  _|   \  / | |_) | | | | | | | | | |  _|  ',
                  '| |\  || |___  /  \ |  _ <| |_| | |_| | | | | |___ ',
                  '|_| \_||_____|/_/\_\|_| \_\\___/ \___/  |_| |_____ |'
              )

              $logoLines = @($logo | ForEach-Object { ([string]$_).TrimEnd() })
              $logoWidth = [int](($logoLines | Measure-Object -Property Length -Maximum).Maximum)
              $leftPadding = [Math]::Max(0, [int](($script:Width - $logoWidth) / 2))

              foreach ($rawLine in $skull) {
                  $line = ([string]$rawLine).TrimEnd()
                  $innerPadding = [Math]::Max(0, [int](($logoWidth - $line.Length) / 2))
                  Write-Host ((' ' * $leftPadding) + (' ' * $innerPadding) + $line) -ForegroundColor Magenta
              }

              Write-Host ''
              $colors = @('Cyan', 'DarkCyan', 'Cyan', 'Magenta', 'Cyan')
              for ($index = 0; $index -lt $logoLines.Count; $index++) {
                  Write-Host ((' ' * $leftPadding) + $logoLines[$index]) -ForegroundColor $colors[$index]
              }
              Write-NexRouteCentered -Value $script:Text.tagline -Color DarkGray
          }

          '''
          theme, count = re.subn(
              r'(?s)function Write-NexRouteCentered \{.*?(?=function Write-NexRouteHeader \{)',
              art_block,
              theme,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Не найден блок центрирования и логотипа')

          progress_block = r'''function Write-NexRouteProgress {
              param([string]$Label, [int]$Percent, [ConsoleColor]$Color = [ConsoleColor]::Cyan)

              # NEXROUTE_PROGRESS_SAFE_FORMAT_V1
              $barWidth = [Math]::Min(42, [Math]::Max(20, $script:Width - 46))
              $filled = [int][Math]::Floor($barWidth * ($Percent / 100.0))
              $bar = ('#' * $filled) + ('-' * ($barWidth - $filled))
              $labelText = Format-NexRouteText -Value $Label -Length 34
              $percentText = $Percent.ToString().PadLeft(3)
              $line = '  ' + $labelText + ' [' + $bar + '] ' + $percentText + '%'
              $rendered = Format-NexRouteText -Value $line -Length ($script:Width - 1)

              try {
                  [Console]::Write("`r")
                  $old = [Console]::ForegroundColor
                  [Console]::ForegroundColor = $Color
                  [Console]::Write($rendered)
                  [Console]::ForegroundColor = $old
                  if ($Percent -ge 100) { [Console]::WriteLine() }
              }
              catch { Write-Host $line -ForegroundColor $Color }
          }

          '''
          theme, count = re.subn(
              r'(?s)function Write-NexRouteProgress \{.*?(?=function Invoke-NexRouteAnimation \{)',
              progress_block,
              theme,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Не найден блок стартового прогресса')
          write(theme_path, theme)

          package_test_path = 'scripts/Test-Package.ps1'
          package_test = read(package_test_path)
          logo_guard = "if ($theme -notmatch [regex]::Escape('| \\ | || ____|\\ \\/ /|  _ \\ / _ \\| | | |_   _| ____|')) { throw 'Classic 0.1.1 logo layout is missing.' }"
          logo_guard_new = logo_guard + "\nif ($theme -notmatch 'NEXROUTE_SKULL_CENTERED_V1') { throw 'Centered skull logo guard is missing.' }\nif ($theme -notmatch 'NEXROUTE_PROGRESS_SAFE_FORMAT_V1') { throw 'Safe startup progress formatter is missing.' }"
          package_test = replace_once(package_test, logo_guard, logo_guard_new, 'Проверка логотипа в Test-Package')

          malformed_guard = "    if ($LASTEXITCODE -ne 0) { throw 'Renderer failed to recover the malformed Root argument shown in user reports.' }\n\n"
          animated_guard = r'''    if ($LASTEXITCODE -ne 0) { throw 'Renderer failed to recover the malformed Root argument shown in user reports.' }

              # Reproduce the real first launch. The previous suite skipped this branch
              # because NEXROUTE_UI_ANIMATE was not set, allowing the format exception
              # from the startup progress renderer to reach released packages.
              $previousAnimation = [Environment]::GetEnvironmentVariable('NEXROUTE_UI_ANIMATE')
              try {
                  [Environment]::SetEnvironmentVariable('NEXROUTE_UI_ANIMATE', '1')
                  & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uiPath -Mode Menu -LanguageFile $languagePath -NonInteractive
                  if ($LASTEXITCODE -ne 0) { throw 'Animated first-launch renderer failed.' }
              }
              finally {
                  [Environment]::SetEnvironmentVariable('NEXROUTE_UI_ANIMATE', $previousAnimation)
              }

          '''
          package_test = replace_once(package_test, malformed_guard, animated_guard, 'Регрессионный тест первого запуска')
          write(package_test_path, package_test)

          repository_test_path = 'scripts/Test-Repository.ps1'
          repository_test = read(repository_test_path).replace('0.4.0', '0.4.1')
          write(repository_test_path, repository_test)

          validate_path = '.github/workflows/validate.yml'
          validate = read(validate_path).replace('0.4.0', '0.4.1')
          write(validate_path, validate)

          write('.service/version.txt', '0.4.1\n')

          package_json_path = 'website/package.json'
          package_json = json.loads(read(package_json_path))
          package_json['version'] = '0.4.1'
          write(package_json_path, json.dumps(package_json, ensure_ascii=False, indent=2) + '\n')

          package_lock_path = Path('website/package-lock.json')
          if package_lock_path.exists():
              package_lock = json.loads(read(str(package_lock_path)))
              package_lock['version'] = '0.4.1'
              if isinstance(package_lock.get('packages'), dict) and isinstance(package_lock['packages'].get(''), dict):
                  package_lock['packages']['']['version'] = '0.4.1'
              write(str(package_lock_path), json.dumps(package_lock, ensure_ascii=False, indent=2) + '\n')

          changelog_path = 'CHANGELOG.md'
          changelog = read(changelog_path)
          changelog_anchor = '## [Unreleased]\n\nПока нет изменений.\n'
          changelog_entry = '''## [Unreleased]\n\nПока нет изменений.\n\n## [0.4.1] - 2026-08-02\n\n### Fixed\n\n- череп в консольном логотипе центрируется относительно полной ASCII-надписи `NEXROUTE`;\n- устранено исключение форматирования строки во время анимации первого запуска;\n- стартовая анимация больше не использует составной оператор `-f` для строки прогресса;\n- добавлен Windows PowerShell 5.1 regression-тест реального первого запуска с `NEXROUTE_UI_ANIMATE=1`.\n'''
          changelog = replace_once(changelog, changelog_anchor, changelog_entry, 'CHANGELOG')
          write(changelog_path, changelog)

          readme_path = 'README.md'
          readme = read(readme_path)
          readme = readme.replace('version-0.4.0-24e1d6', 'version-0.4.1-24e1d6')
          readme_anchor = '## Что изменилось в 0.4.0 🌐\n'
          readme_hotfix = '''## Что изменилось в 0.4.1 🛠️\n\nВерсия `0.4.1` исправляет два дефекта консольного интерфейса:\n\n- ASCII-череп теперь вычисляет позицию от ширины надписи `NEXROUTE` и всегда находится строго над её центром;\n- устранён вылет первого запуска с ошибкой форматирования строки в анимированном индикаторе загрузки;\n- package regression suite запускает реальную стартовую анимацию в Windows PowerShell 5.1.\n\n'''
          readme = replace_once(readme, readme_anchor, readme_hotfix + readme_anchor, 'Раздел README 0.4.1')
          readme = readme.replace('NexRoute-0.4.0-win-x64', 'NexRoute-0.4.1-win-x64')
          readme = readme.replace('**NexRoute 0.4.0**', '**NexRoute 0.4.1**')
          write(readme_path, readme)

          english_path = Path('docs/README_EN.md')
          if english_path.exists():
              english = read(str(english_path))
              english = english.replace('version-0.4.0-24e1d6', 'version-0.4.1-24e1d6')
              english_anchor = '## Version 0.4.0 — official website source\n'
              english_hotfix = '''## Version 0.4.1 — console startup hotfix\n\nVersion 0.4.1 centers the skull relative to the full NEXROUTE wordmark, removes the composite formatter from the animated startup progress line, and adds a Windows PowerShell 5.1 first-launch regression test.\n\n'''
              if english_anchor in english:
                  english = replace_once(english, english_anchor, english_hotfix + english_anchor, 'English README 0.4.1')
              english = english.replace('NexRoute-0.4.0-win-x64', 'NexRoute-0.4.1-win-x64')
              write(str(english_path), english)

          release_notes = '''# NexRoute 0.4.1 — исправление запуска и логотипа 💀\n\n## Исправлено\n\n- череп в верхней части консольного логотипа теперь центрируется относительно полной ширины ASCII-надписи `NEXROUTE`, а не относительно собственной строки;\n- устранён вылет сразу после запуска с сообщением `Error formatting a string: Index (zero based) must be greater than or equal to zero and less than the size of the argument list.`;\n- стартовый индикатор загрузки собирает строку безопасной конкатенацией и больше не зависит от составного форматирования `-f`;\n- удаляются хвостовые пробелы ASCII-графики, поэтому центрирование остаётся правильным при разной ширине окна консоли.\n\n## Проверки\n\n- Windows PowerShell 5.1 запускает меню с `NEXROUTE_UI_ANIMATE=1`, то есть проверяется именно первый анимированный запуск;\n- сохранены проверки RU/EN интерфейса, 21 стратегии, 15 профилей Service Matrix, updater, locked upstream, SHA-256 и build provenance;\n- релиз собирается штатным GitHub Actions workflow и публикуется с архивом и контрольной суммой.\n\n## Установка\n\n1. Скачайте `NexRoute-0.4.1-win-x64.zip` и `NexRoute-0.4.1-win-x64.zip.sha256`.\n2. Полностью распакуйте архив в новую папку.\n3. Запустите `NexRoute.lnk`, `nexroute.bat` или `service.bat` от имени администратора.\n\nНе запускайте BAT/CMD-файлы непосредственно из ZIP-архива.\n'''
          write('.github/release-notes/v0.4.1.md', release_notes)

          workflow_path = Path('.github/workflows/materialize-v0.4.1-hotfix.yml')
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Проверить изменения
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'NEXROUTE_SKULL_CENTERED_V1' overlay/.service/i18n/nexroute-theme.ps1
          grep -F 'NEXROUTE_PROGRESS_SAFE_FORMAT_V1' overlay/.service/i18n/nexroute-theme.ps1
          grep -F 'NEXROUTE_UI_ANIMATE' scripts/Test-Package.ps1
          test "$(tr -d '\r\n' < .service/version.txt)" = '0.4.1'
          test -f .github/release-notes/v0.4.1.md
          git diff --check

      - name: Зафиксировать hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NexRoute 0.4.1: исправить запуск и логотип"
          git push origin HEAD:main

      - name: Запустить защищённый релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main

      - name: Отчитаться и закрыть задачу
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment '${{ github.event.issue.number }}' --body 'Hotfix NexRoute 0.4.1 применён к main. Защищённая сборка и публикация релиза запущены.'
          gh issue close '${{ github.event.issue.number }}' --reason completed
