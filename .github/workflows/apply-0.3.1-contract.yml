name: Apply NexRoute 0.3.1 contract

on:
  push:
    branches:
      - release/0.3.1
    paths:
      - '.github/workflows/apply-0.3.1-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.3.1
          fetch-depth: 0

      - name: Patch repository and package contracts
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='')

          repository_test = Path('scripts/Test-Repository.ps1')
          replace_once(repository_test, "$expectedVersion = '0.3.0'", "$expectedVersion = '0.3.1'")
          replace_once(
              repository_test,
              "    'overlay/nexroute.bat','overlay/.service/nexroute-ui.ps1','overlay/.service/nexroute-services.ps1',",
              "    'overlay/nexroute.bat','overlay/nexroute-update.cmd','overlay/.service/nexroute-ui.ps1',`n    'overlay/.service/nexroute-updater.ps1','overlay/.service/nexroute-services.ps1',".replace('`n', '\n')
          )
          replace_once(
              repository_test,
              "    'overlay/.service/i18n/nexroute-pages-core.ps1','overlay/.service/i18n/nexroute-pages-network.ps1',",
              "    'overlay/.service/i18n/nexroute-pages-core.ps1','overlay/.service/i18n/nexroute-pages-network.ps1',`n    'overlay/.service/i18n/nexroute-pages-update.ps1',".replace('`n', '\n')
          )
          replace_once(
              repository_test,
              "    'tests/ServiceMatrix.Tests.ps1','tests/UpstreamContract.Tests.ps1',",
              "    'tests/ServiceMatrix.Tests.ps1','tests/UpstreamContract.Tests.ps1','tests/Updater.Tests.ps1',"
          )
          replace_once(
              repository_test,
              "    '.github/release-notes/v0.3.0.md','docs/SERVICES.md','docs/UPSTREAM.md','docs/RELEASES.md'",
              "    '.github/release-notes/v0.3.1.md','docs/SERVICES.md','docs/UPSTREAM.md','docs/RELEASES.md','docs/UPDATES.md'"
          )
          replace_once(
              repository_test,
              "Assert-True ($readme -match 'offline|офлайн') 'README documents offline rebuilds'",
              "Assert-True ($readme -match 'offline|офлайн') 'README documents offline rebuilds'\nAssert-True ($readme -match 'nexroute-update\\.cmd') 'README documents the manual update center'\nAssert-True ($readme -match 'update-state\\.json') 'README documents updater state'"
          )
          updater_anchor = "$validateWorkflow = Get-Content -LiteralPath (Join-Path $root '.github/workflows/validate.yml') -Raw"
          updater_checks = r'''$updater = Get-Content -LiteralPath (Join-Path $root 'overlay/.service/nexroute-updater.ps1') -Raw
          foreach ($token in @('releases/latest','Prerelease builds are not accepted','SHA-256 mismatch','NexRoute-backups','rolled-back','NexRouteUpdater-')) {
              Assert-True ($updater -match [regex]::Escape($token)) "Updater contains $token"
          }

          $updaterTests = Get-Content -LiteralPath (Join-Path $root 'tests/Updater.Tests.ps1') -Raw
          foreach ($token in @('preserves user state','rolls back','mismatched checksum','automatic update cooldown','automatic updates are disabled')) {
              Assert-True ($updaterTests -match [regex]::Escape($token)) "Updater Pester suite covers $token"
          }

          $updateLauncher = Get-Content -LiteralPath (Join-Path $root 'overlay/nexroute.bat') -Raw
          Assert-True ($updateLauncher -match 'nexroute-updater\.ps1') 'Launcher invokes the updater'
          Assert-True ($updateLauncher -match '-Mode Auto') 'Launcher performs automatic update checks'

          ''' + updater_anchor
          replace_once(repository_test, updater_anchor, updater_checks)
          replace_once(
              repository_test,
              "foreach ($token in @('UpstreamContract.Tests.ps1','UpstreamCachePath','UpstreamArchive','offline','0.3.0')) {",
              "foreach ($token in @('Updater fixture suites','UpstreamCachePath','UpstreamArchive','offline','0.3.1')) {"
          )

          release_test = Path('scripts/Test-Release.ps1')
          replace_once(
              release_test,
              "    '.service/patch-report.json',\n    '.service/i18n/nexroute-pages-core.ps1',",
              "    '.service/patch-report.json',\n    '.service/nexroute-updater.ps1',\n    '.service/i18n/nexroute-pages-update.ps1',\n    'nexroute-update.cmd',\n    '.service/i18n/nexroute-pages-core.ps1',"
          )
          service_anchor = "$strategyFiles = @(Get-ChildItem -LiteralPath $root -Filter '*.bat' -File | Where-Object { $_.Name -notin @('service.bat','nexroute.bat') })"
          package_checks = r'''$launcher = Get-Content -LiteralPath (Join-Path $root 'nexroute.bat') -Raw
          foreach ($token in @('nexroute-updater.ps1','check_updates.enabled','-Mode Auto')) {
              if ($launcher -notmatch [regex]::Escape($token)) { throw "nexroute.bat is missing updater token: $token" }
          }
          $updater = Get-Content -LiteralPath (Join-Path $root '.service/nexroute-updater.ps1') -Raw
          foreach ($token in @('releases/latest','NexRoute-backups','SHA-256 mismatch','rolled-back')) {
              if ($updater -notmatch [regex]::Escape($token)) { throw "Updater is missing package token: $token" }
          }
          $updatePage = Get-Content -LiteralPath (Join-Path $root '.service/i18n/nexroute-pages-update.ps1') -Raw
          if ($updatePage -notmatch '-Mode Menu') { throw 'Update Center UI is not connected to the updater menu.' }

          ''' + service_anchor
          replace_once(release_test, service_anchor, package_checks)

      - name: Commit contract updates
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/Test-Repository.ps1 scripts/Test-Release.ps1
          git commit -m "test: enforce NexRoute 0.3.1 updater contract"
          git push origin HEAD:release/0.3.1
