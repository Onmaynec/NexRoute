name: Применить NexRoute 0.4.1 hotfix через push

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-v0.4.1-hotfix-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  materialize:
    name: Материализовать hotfix и запустить релиз
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: запустить подготовку NexRoute 0.4.1'
    runs-on: ubuntu-latest

    steps:
      - name: Получить main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Выполнить подготовленный сценарий исправления
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/materialize-v0.4.1-hotfix-v2.yml')
          if not source.exists():
              raise SystemExit('Не найден сохранённый materializer v2')

          workflow = source.read_text(encoding='utf-8')
          match = re.search(
              r"(?ms)^\s*python3 - <<'PY'\s*\n(?P<body>.*?)^\s*PY\s*$",
              workflow,
          )
          if not match:
              raise SystemExit('Не удалось извлечь Python-сценарий из materializer v2')

          body = textwrap.dedent(match.group('body'))
          exec(compile(body, str(source) + ':embedded-python', 'exec'), {'__name__': '__main__'})
          PY

          rm -f .github/workflows/materialize-v0.4.1-hotfix-v3.yml

      - name: Проверить итоговый diff
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'NEXROUTE_SKULL_CENTERED_V1' overlay/.service/i18n/nexroute-theme.ps1
          grep -F 'NEXROUTE_PROGRESS_SAFE_FORMAT_V1' overlay/.service/i18n/nexroute-theme.ps1
          grep -F "SetEnvironmentVariable('NEXROUTE_UI_ANIMATE', '1')" scripts/Test-Package.ps1
          test "$(tr -d '\r\n' < .service/version.txt)" = '0.4.1'
          test -f .github/release-notes/v0.4.1.md
          test ! -f .github/workflows/materialize-v0.4.1-hotfix.yml
          test ! -f .github/workflows/materialize-v0.4.1-hotfix-v2.yml
          test ! -f .github/workflows/materialize-v0.4.1-hotfix-v3.yml
          git diff --check

      - name: Зафиксировать NexRoute 0.4.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NexRoute 0.4.1: исправить запуск и логотип"
          git push origin HEAD:main

      - name: Запустить штатную защищённую сборку
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main

      - name: Закрыть технические триггеры
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for issue in 27 29; do
            state="$(gh issue view "$issue" --json state --jq .state 2>/dev/null || true)"
            if [[ "$state" == 'OPEN' ]]; then
              gh issue close "$issue" --comment 'Hotfix NexRoute 0.4.1 применён через push-trigger; релизная сборка запущена.'
            fi
          done
