name: Apply strict patch ID fix

on:
  push:
    branches:
      - release/0.3.0
    paths:
      - '.github/workflows/patch-patchids.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.3.0
          fetch-depth: 0

      - name: Patch HashSet tracking
        shell: pwsh
        run: |
          $path = './scripts/Build-Release.ps1'
          $content = Get-Content -LiteralPath $path -Raw -Encoding UTF8

          $anchor = "$patchJournal = New-Object 'System.Collections.Generic.List[object]'"
          $replacement = $anchor + [Environment]::NewLine + "$patchIds = New-Object 'System.Collections.Generic.HashSet[string]'"
          if ([regex]::Matches($content, [regex]::Escape($anchor)).Count -ne 1) {
            throw 'Patch journal anchor mismatch.'
          }
          $content = $content.Replace($anchor, $replacement)

          $oldFirst = 'if ($patchJournal.Id -contains $Id) { throw "Duplicate patch id: $Id" }'
          $newFirst = 'if (-not $patchIds.Add($Id)) { throw "Duplicate patch id: $Id" }'
          if ([regex]::Matches($content, [regex]::Escape($oldFirst)).Count -ne 1) {
            throw 'First patch-ID check anchor mismatch.'
          }
          $content = $content.Replace($oldFirst, $newFirst)

          $oldFinal = 'if (($patchJournal.Id | Sort-Object -Unique).Count -ne $patchJournal.Count) {'
          $newFinal = 'if ($patchIds.Count -ne $patchJournal.Count) {'
          if ([regex]::Matches($content, [regex]::Escape($oldFinal)).Count -ne 1) {
            throw 'Final patch-ID check anchor mismatch.'
          }
          $content = $content.Replace($oldFinal, $newFinal)

          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/Build-Release.ps1
          git commit -m "fix: track patch IDs with a HashSet"
          git push origin HEAD:release/0.3.0
