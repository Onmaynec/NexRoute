name: Dispatch NexRoute 0.6.3 release retry once

on:
  issues:
    types:
      - opened
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  dispatch:
    if: github.repository == 'Onmaynec/NexRoute' && (github.event_name != 'issues' || github.event.issue.title == 'Dispatch NexRoute 0.6.3 release retry')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Confirm release is still pending
        id: pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .service/version.txt)"
          [[ "$version" == "0.6.3" ]] || { echo "Expected 0.6.3, got $version" >&2; exit 1; }
          if gh release view v0.6.3 >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove one-shot retry dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-v0.6.3-retry.yml
          git commit -m "ci: remove NexRoute 0.6.3 release retry dispatcher"
          git push origin HEAD:main

      - name: Wait for clean main
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          for attempt in {1..12}; do
            actual="$(git ls-remote origin refs/heads/main | cut -f1)"
            [[ "$actual" == "$expected" ]] && exit 0
            sleep 5
          done
          echo "main did not advance to retry-dispatcher removal commit" >&2
          exit 1

      - name: Dispatch release workflow on fixed main
        if: steps.pending.outputs.release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --comment "Retry release workflow dispatched for NexRoute v0.6.3 from the fixed main branch."
