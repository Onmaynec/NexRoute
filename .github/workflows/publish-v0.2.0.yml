name: Publish NexRoute 0.2.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.2.0.yml'
      - '.github/release-notes/v0.2.0.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish v0.2.0
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate source tree
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
      - name: Build release package
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -ne '0.2.0') { throw "This workflow only publishes 0.2.0; repository version is $version." }
          ./scripts/Build-NexRoute.ps1 -Version $version -UpstreamVersion '1.10.0' -OutputDirectory ./artifacts
      - name: Inspect release package
        shell: pwsh
        run: |
          $archive = Get-ChildItem ./artifacts -Filter 'NexRoute-0.2.0-win-x64.zip' -File | Select-Object -First 1
          $checksum = Get-ChildItem ./artifacts -Filter 'NexRoute-0.2.0-win-x64.zip.sha256' -File | Select-Object -First 1
          if (-not $archive -or -not $checksum) { throw 'Release output is incomplete.' }
          $expected = ((Get-Content $checksum.FullName -Raw) -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA-256 mismatch: expected $expected, got $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'nexroute-release-0.2.0'
          Expand-Archive $archive.FullName $extract -Force
          foreach ($path in @('.service/nexroute-console.ps1','.service/nexroute-pages.ps1','.service/nexroute-services.ps1','assets/nexroute-mark.svg')) {
            if (-not (Test-Path (Join-Path $extract $path) -PathType Leaf)) { throw "Release is missing $path" }
          }
          $service = Get-Content (Join-Path $extract 'service.bat') -Raw
          if ($service -notmatch 'nexroute_service_matrix') { throw 'Service matrix is not wired into service.bat.' }
          "release_sha256=$actual" >> $env:GITHUB_ENV
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexRoute-0.2.0-win-x64
          path: |
            artifacts/NexRoute-0.2.0-win-x64.zip
            artifacts/NexRoute-0.2.0-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.2.0'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists."; exit 0 }
          gh release create $tag `
            ./artifacts/NexRoute-0.2.0-win-x64.zip `
            ./artifacts/NexRoute-0.2.0-win-x64.zip.sha256 `
            --target $env:GITHUB_SHA `
            --title 'NexRoute 0.2.0 — Service Matrix' `
            --notes-file './.github/release-notes/v0.2.0.md' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag." }
          Write-Host "Published $tag"
          Write-Host "SHA-256: $env:release_sha256"
