name: Publish NexRoute 0.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.0.yml'
      - '.github/release-notes/v0.1.0.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish v0.1.0
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source tree
        shell: pwsh
        run: ./scripts/Test-Repository.ps1

      - name: Build release package
        shell: pwsh
        run: |
          $version = (Get-Content ./.service/version.txt -Raw).Trim()
          if ($version -ne '0.1.0') {
            throw "This bootstrap workflow only publishes 0.1.0, repository version is $version."
          }

          ./scripts/Build-NexRoute.ps1 `
            -Version $version `
            -UpstreamVersion '1.10.0' `
            -OutputDirectory ./artifacts

      - name: Verify package checksum
        shell: pwsh
        run: |
          $archive = Get-ChildItem ./artifacts -Filter 'NexRoute-0.1.0-win-x64.zip' -File | Select-Object -First 1
          $checksum = Get-ChildItem ./artifacts -Filter 'NexRoute-0.1.0-win-x64.zip.sha256' -File | Select-Object -First 1

          if (-not $archive -or -not $checksum) {
            throw 'Release output is incomplete.'
          }
          if ($archive.Length -lt 1MB) {
            throw 'Release archive is unexpectedly small.'
          }

          Push-Location ./artifacts
          try {
            $expectedLine = Get-Content $checksum.Name -Raw
            $expectedHash = ($expectedLine -split '\s+')[0].Trim()
            $actualHash = (Get-FileHash $archive.Name -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) {
              throw "SHA-256 mismatch: expected $expectedHash, got $actualHash"
            }
          }
          finally {
            Pop-Location
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.0'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; no action is required."
            exit 0
          }

          $archive = (Get-ChildItem ./artifacts -Filter 'NexRoute-0.1.0-win-x64.zip' -File | Select-Object -First 1).FullName
          $checksum = (Get-ChildItem ./artifacts -Filter 'NexRoute-0.1.0-win-x64.zip.sha256' -File | Select-Object -First 1).FullName

          gh release create $tag `
            $archive `
            $checksum `
            --target $env:GITHUB_SHA `
            --title 'NexRoute 0.1.0' `
            --notes-file './.github/release-notes/v0.1.0.md' `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release $tag."
          }
