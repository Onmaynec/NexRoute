name: Prepare NexRoute 0.3.2 release PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    name: Finalize release branch metadata
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/0.3.2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Apply NexRoute 0.3.2 metadata
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $from = '0.3.1'
          $to = '0.3.2'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $versionPath = '.service/version.txt'
          $current = (Get-Content -LiteralPath $versionPath -Raw -Encoding UTF8).Trim()

          if ($current -eq $to) {
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($current -ne $from) {
            throw "Unexpected repository version: $current"
          }

          foreach ($path in @(
            '.service/version.txt',
            'README.md',
            'docs/README_EN.md',
            'scripts/Test-Repository.ps1',
            '.github/workflows/validate.yml'
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release metadata file is missing: $path"
            }
            $resolved = (Resolve-Path $path).Path
            $text = [System.IO.File]::ReadAllText($resolved, [System.Text.Encoding]::UTF8)
            $text = $text.Replace($from, $to)
            [System.IO.File]::WriteAllText($resolved, $text, $utf8)
          }

          $readmePath = (Resolve-Path 'README.md').Path
          $readme = [System.IO.File]::ReadAllText($readmePath, [System.Text.Encoding]::UTF8)
          $readme = $readme.Replace(
            'Полноценная кодовая подпись и provenance attestation планируются отдельно.',
            'GitHub build provenance attestation публикуется для ZIP и checksum-файла. Она подтверждает workflow и commit сборки, но не заменяет Windows Authenticode code signing.'
          )
          if ($readme -notmatch 'docs/ATTESTATIONS\.md') {
            $readme = $readme.Replace(
              'Подробности: [docs/UPDATES.md](docs/UPDATES.md).',
              "Подробности: [docs/UPDATES.md](docs/UPDATES.md).`n`nПроверка происхождения release assets: [docs/ATTESTATIONS.md](docs/ATTESTATIONS.md)."
            )
          }
          [System.IO.File]::WriteAllText($readmePath, $readme, $utf8)

          $englishPath = (Resolve-Path 'docs/README_EN.md').Path
          $english = [System.IO.File]::ReadAllText($englishPath, [System.Text.Encoding]::UTF8)
          if ($english -notmatch 'ATTESTATIONS\.md') {
            $english += "`n`n## Build provenance attestations`n`nOfficial release ZIP and checksum assets are covered by GitHub build provenance attestations. Verification instructions: [ATTESTATIONS.md](ATTESTATIONS.md).`n"
          }
          [System.IO.File]::WriteAllText($englishPath, $english, $utf8)

          $changelogPath = (Resolve-Path 'CHANGELOG.md').Path
          $changelog = [System.IO.File]::ReadAllText($changelogPath, [System.Text.Encoding]::UTF8)
          if ($changelog -notmatch '(?m)^## \[0\.3\.2\]') {
            $entry = @'
## [0.3.2] - 2026-08-02

### Added

- GitHub build provenance attestations for the official ZIP and `.sha256` release assets;
- self-verification with `gh attestation verify` before GitHub Release publication;
- `docs/ATTESTATIONS.md` with verification and trust-boundary guidance;
- Pester contract tests for attestation permissions, subjects and release-step ordering.

### Security

- release assets are cryptographically bound to the `Onmaynec/NexRoute` GitHub Actions workflow and source commit through Sigstore-backed attestations;
- SHA-256 verification remains required and complements, rather than replaces, provenance verification.
'@
            $anchor = '## [0.3.1] - 2026-08-01'
            if (-not $changelog.Contains($anchor)) {
              throw 'Unable to locate the 0.3.1 changelog anchor.'
            }
            $changelog = $changelog.Replace($anchor, ($entry.Trim() + "`n`n" + $anchor))
          }
          [System.IO.File]::WriteAllText($changelogPath, $changelog, $utf8)

          $repositoryTestPath = (Resolve-Path 'scripts/Test-Repository.ps1').Path
          $repositoryTest = [System.IO.File]::ReadAllText($repositoryTestPath, [System.Text.Encoding]::UTF8)
          if ($repositoryTest -notmatch 'ReleaseAttestation\.Tests\.ps1') {
            $repositoryTest = $repositoryTest.Replace(
              "'tests/ServiceMatrix.Tests.ps1','tests/UpstreamContract.Tests.ps1','tests/Updater.Tests.ps1',",
              "'tests/ServiceMatrix.Tests.ps1','tests/UpstreamContract.Tests.ps1','tests/Updater.Tests.ps1','tests/ReleaseAttestation.Tests.ps1',"
            )
          }
          if ($repositoryTest -notmatch 'docs/ATTESTATIONS\.md') {
            $repositoryTest = $repositoryTest.Replace(
              "'docs/SERVICES.md','docs/UPSTREAM.md','docs/RELEASES.md','docs/UPDATES.md'",
              "'docs/SERVICES.md','docs/UPSTREAM.md','docs/RELEASES.md','docs/UPDATES.md','docs/ATTESTATIONS.md'"
            )
          }
          [System.IO.File]::WriteAllText($repositoryTestPath, $repositoryTest, $utf8)

          Remove-Item -LiteralPath '.github/workflows/finalize-v0.3.2.yml' -Force
          Remove-Item -LiteralPath '.github/release-v0.3.2.marker' -Force -ErrorAction SilentlyContinue

          if ((Get-Content -LiteralPath $versionPath -Raw -Encoding UTF8).Trim() -ne $to) {
            throw 'Version finalization did not produce 0.3.2.'
          }
          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Install pinned Pester
        if: steps.prepare.outputs.changed == 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber

      - name: Validate finalized sources
        if: steps.prepare.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./scripts/Test-Repository.ps1
          $result = Invoke-Pester -Path ./tests -CI -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester tests failed." }

      - name: Commit finalized release branch
        if: steps.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: finalize NexRoute 0.3.2"
          git push origin HEAD:${{ github.head_ref }}
