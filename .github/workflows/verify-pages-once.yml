name: Verify NexRoute GitHub Pages once

on:
  issues:
    types:
      - opened

permissions:
  actions: read
  contents: write
  issues: write
  pages: write

jobs:
  verify:
    name: Verify published website
    if: github.repository == 'Onmaynec/NexRoute' && github.event.issue.title == 'Verify NexRoute GitHub Pages'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Inspect Pages workflow and public URL
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=''
          status='missing'
          conclusion='unknown'
          run_url=''

          for _ in $(seq 1 36); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=main&per_page=20")"
            run_json="$(jq -c '[.workflow_runs[] | select(.event == "push")][0] // {}' <<<"$runs")"
            status="$(jq -r '.status // "missing"' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"$run_json")"
            run_url="$(jq -r '.html_url // ""' <<<"$run_json")"
            if [[ "$status" == 'completed' ]]; then
              break
            fi
            sleep 5
          done

          pages_json=''
          pages_error=''
          if ! pages_json="$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/tmp/pages-error.txt)"; then
            pages_error="$(cat /tmp/pages-error.txt)"
          fi
          site_url="$(jq -r '.html_url // ""' <<<"${pages_json:-{}}" 2>/dev/null || true)"
          build_type="$(jq -r '.build_type // "unknown"' <<<"${pages_json:-{}}" 2>/dev/null || true)"
          http_status='not-checked'
          title=''
          if [[ -n "$site_url" ]]; then
            http_status="$(curl -L -sS -o /tmp/nexroute-pages.html -w '%{http_code}' "${site_url%/}/" || true)"
            title="$(grep -o '<title>[^<]*' /tmp/nexroute-pages.html 2>/dev/null | head -n 1 | sed 's/<title>//' || true)"
          fi

          {
            echo '## NexRoute GitHub Pages verification'
            echo
            echo "- Workflow status: \`$status\`"
            echo "- Workflow conclusion: \`$conclusion\`"
            echo "- Workflow run: ${run_url:-not found}"
            echo "- Pages URL: ${site_url:-not enabled}"
            echo "- Pages build type: \`${build_type:-unknown}\`"
            echo "- HTTP status: \`$http_status\`"
            echo "- Page title: ${title:-not available}"
            if [[ -n "$pages_error" ]]; then
              echo
              echo '<details><summary>Pages API error</summary>'
              echo
              echo '```text'
              echo "$pages_error"
              echo '```'
              echo '</details>'
            fi
          } > /tmp/pages-verification.md

          cat /tmp/pages-verification.md

      - name: Report verification and close issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body-file /tmp/pages-verification.md
          gh issue close '${{ github.event.issue.number }}' --reason completed

      - name: Remove one-shot verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-pages-once.yml
          git commit -m 'ci: remove NexRoute Pages verifier'
          git push origin HEAD:main
