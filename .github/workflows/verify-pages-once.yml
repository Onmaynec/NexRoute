name: Одноразовая проверка NexRoute GitHub Pages

on:
  issues:
    types:
      - opened

permissions:
  actions: read
  contents: write
  issues: write
  pages: read

jobs:
  verify:
    if: github.event.issue.title == 'Проверить публикацию NexRoute Pages'
    runs-on: ubuntu-latest

    steps:
      - name: Получить main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Дождаться deployment и проверить сайт
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          run_id=''
          run_url=''
          conclusion=''

          for attempt in $(seq 1 36); do
            run_json="$(gh run list --workflow pages.yml --branch main --event push --limit 1 --json databaseId,status,conclusion,url 2>/dev/null || true)"
            run_id="$(printf '%s' "$run_json" | jq -r '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              status="$(printf '%s' "$run_json" | jq -r '.[0].status // empty')"
              conclusion="$(printf '%s' "$run_json" | jq -r '.[0].conclusion // empty')"
              run_url="$(printf '%s' "$run_json" | jq -r '.[0].url // empty')"
              if [[ "$status" == 'completed' ]]; then
                break
              fi
            fi
            sleep 10
          done

          pages_json="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          page_url="$(printf '%s' "$pages_json" | jq -r '.html_url')"
          build_type="$(printf '%s' "$pages_json" | jq -r '.build_type // "unknown"')"

          http_status="$(curl -L -sS -o /tmp/nexroute-pages.html -w '%{http_code}' "$page_url")"
          title="$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/nexroute-pages.html').read_text(encoding='utf-8', errors='ignore')
          match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
          print(re.sub(r'\s+', ' ', match.group(1)).strip() if match else 'не найден')
          PY
          )"

          cat > /tmp/report.md <<EOF
          ## Проверка NexRoute GitHub Pages

          - Deployment: \`${conclusion:-неизвестно}\`
          - Workflow: ${run_url:-не найден}
          - Pages URL: ${page_url}
          - Build type: \`${build_type}\`
          - HTTP status: \`${http_status}\`
          - Page title: \`${title}\`
          EOF

          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/report.md

          if [[ "$conclusion" != 'success' || "$http_status" != '200' ]]; then
            exit 1
          fi

          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Удалить одноразовую проверку
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-pages-once.yml
          git commit -m 'Убрать одноразовую проверку GitHub Pages'
          git push origin HEAD:main
